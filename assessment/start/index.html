function recommendationHandoff(link){let last=journeyIdentity(),route=link.dataset.recRoute||'',productType=route==='Single Stage'?'single_stage':route==='Two-Stage Pair'?'two_stage_pair':route==='Bare Minimum'?'bare_minimum':'return_to_you_series';let p={product:link.dataset.recProduct||'',route:route,recommendation_category:recommendationCategory,product_type:productType,submission_id:last.submissionId||'',journey_id:last.journeyId||'',destination:(link.hostname||location.hostname||'').toLowerCase()};let external=link.origin&&link.origin!==location.origin;let jv={product:p.product,route:p.route,recommendation_category:p.recommendation_category,cta:p.product,destination:p.destination,product_clicked:p.product,price:link.dataset.recPrice||'',currency:'GBP',destination_url:(link.href||'').slice(0,200)};postJourneyEvents(external?[['primary_cta_click',jv],['outbound_payhip_click',jv]]:[['primary_cta_click',jv]]);let analyticsParams={product:p.product,route:p.route,recommendation_category:p.recommendation_category,product_type:p.product_type,destination:p.destination,transport_type:'beacon'};track('recommendation_click',analyticsParams);track('primary_cta_click',analyticsParams);if(external){track('checkout_click',analyticsParams);try{sessionStorage.setItem('yms_v3_last_checkout',JSON.stringify(Object.assign({clickedAt:new Date().toISOString()},p)))}catch(e){}}}
el.addEventListener('click',e=>{let link=e.target.closest('a[data-rec-product]');if(link)recommendationHandoff(link)});
let rp=-1,navLocked=false;const showPanel=(n,historyMode)=>{rp=n;el.querySelectorAll('.result-panel').forEach((p,j)=>p.classList.toggle('active',j===n));document.getElementById('count').textContent='YOUR RESULT';document.getElementById('fill').style.width=((n+1)/panels.length*100)+'%';if(historyMode==='push')history.pushState({ymsResult:true,resultStep:n},'',location.href);else if(historyMode==='replace')history.replaceState({ymsResult:true,resultStep:n},'',location.href);window.scrollTo({top:0,behavior:'smooth'});let panel=el.querySelectorAll('.result-panel')[n],batch=[];if(panel&&panel.querySelector('.rec-offer a[data-rec-product]')){let link=panel.querySelector('.rec-offer a[data-rec-product]'),vals={product:link?link.dataset.recProduct:'',route:link?link.dataset.recRoute:'',recommendation_category:recommendationCategory,price:link?link.dataset.recPrice||'':'',currency:'GBP'};if(!panel.dataset.offerTracked){panel.dataset.offerTracked='1';batch.push(['recommendation_shown',vals],['final_route_shown',vals]);track('recommendation_shown',vals)}}if(panel&&!panel.dataset.journeyViewTracked){panel.dataset.journeyViewTracked='1';batch.push(['result_step_view',{step:n+1,total_steps:panels.length}])}batch.forEach(e=>postJourneyEvent(e[0],e[1]));track('result_step_view',{step:n+1,step_number:n+1,step_id:'result_'+(n+1),step_name:'Result step '+(n+1),total_steps:panels.length});track('yms_result_screen_'+(n+1)+'_view',{step_number:n+1})};
el.addEventListener('click',e=>{if(navLocked)return;let next=e.target.closest('.result-next'),back=e.target.closest('.result-back');if(!next&&!back)return;navLocked=true;if(next){track('result_next_click',{from_step:rp+1,to_step:rp+2});let np=el.querySelectorAll('.result-panel')[rp+1];if(np&&np.querySelector('.rec'))postJourneyEvent('recommendation_reveal_click',{step:rp+2,total_steps:panels.length});showPanel(Math.min(rp+1,panels.length-1),'push')}else{postJourneyEvent('result_back_click',{step:rp+1});track('result_back_click',{from_step:rp+1,to_step:Math.max(1,rp)});history.back()}setTimeout(()=>navLocked=false,350)});
showPanel(0,'replace');
track('assessment_complete',{recommendation_category:recommendationCategory});
}
function recommendationCopy(q,r){if(q.length===0)return 'Your scored answers do not show a strong enough concentration in one of the four stages for me to push you into a larger programme. Start with the smallest sensible next step.';if(q.length===1)return 'One stage is clearly asking for attention first. I would begin there rather than giving you more than your answers suggest you need.';if(q.length===2)return 'Two stages are showing up strongly. I would work through those in sequence so the support matches the pattern your answers actually show.';return 'Your answers show a broad pattern across at least three stages, so the Return to You Series is the relevant next step. It lets you work through every area in sequence, in your own time.'}
window.addEventListener('popstate',e=>{if(!document.getElementById('result').classList.contains('active'))return;let panels=[...document.querySelectorAll('.result-panel')];if(!panels.length)return;let step=e.state&&e.state.ymsResult&&Number.isInteger(e.state.resultStep)?e.state.resultStep:null;if(step!==null&&step>=0&&step<panels.length){let cur=panels.findIndex(p=>p.classList.contains('active'));if(cur!==step){panels.forEach((p,j)=>p.classList.toggle('active',j===step));document.getElementById('count').textContent='YOUR RESULT · '+(step+1)+' / '+panels.length;document.getElementById('fill').style.width=((step+1)/panels.length*100)+'%';window.scrollTo({top:0,behavior:'smooth'});postJourneyEvent('result_step_view',{step:step+1,total_steps:panels.length,navigation:'browser_back'});track('result_step_view',{step:step+1,step_number:step+1,step_id:'result_'+(step+1),navigation:'browser_back'})}}});

try{let saved=JSON.parse(sessionStorage.getItem('yms_v3_result_state')||'null');if(saved&&saved.submitted&&Array.isArray(saved.answers)){a=saved.answers;lead=saved.lead||{};showResult()}else{postJourneyEvent('assessment_start',{step:1});track('assessment_start');render()}}catch(e){postJourneyEvent('assessment_start',{step:1});track('assessment_start');render()}
