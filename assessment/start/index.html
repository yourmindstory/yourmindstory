async function flushV4Events(){
 if(!V3_BACKEND||v4EventSending||!v4PendingEvents.length)return;
 if(v4SubmissionInFlight||v4FinalizeInFlight){scheduleV4Flush(1500);return}
 v4EventSending=true;
 const batch=v4PendingEvents.splice(0,10);
 try{
  const r=await fetch(V3_BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(v4EventPayload(batch)),keepalive:true});
  if(!r.ok)throw new Error('HTTP '+r.status);
 }catch(err){console.warn('V4 event batch could not be confirmed',err);if(batch.length&&!batch[0][3]){batch.forEach(e=>e[3]=1);v4PendingEvents.unshift(...batch)}}
 finally{v4EventSending=false;if(v4PendingEvents.length)scheduleV4Flush(600)}
}
// Page hidden or closing (app switch, tab close, link to the sales page): send everything that is left.
function beaconV4Events(){
 if(!V3_BACKEND)return;
 while(v4PendingEvents.length){
  const body=JSON.stringify(v4EventPayload(v4PendingEvents.splice(0,10)));
  let ok=false;
  try{ok=!!(navigator.sendBeacon&&navigator.sendBeacon(V3_BACKEND,new Blob([body],{type:'text/plain;charset=utf-8'})))}catch(e){}
  if(!ok){try{fetch(V3_BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,keepalive:true})}catch(e){}}
 }
}
