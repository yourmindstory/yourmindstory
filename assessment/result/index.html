<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Your Personalised Result | Your Mind Story</title>
<style>body{margin:0;background:#f6f7f3;color:#162922;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:700px;margin:40px auto;padding:30px;background:#fff;box-shadow:0 6px 40px #24372c12}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:12px;color:#6b816d}.title{font-family:Georgia,serif;font-size:clamp(32px,5vw,44px);line-height:1.1}h2{font-family:Georgia,serif;font-size:27px}.muted{color:#56665c}.panel{margin:20px 0;border:1px solid #d9dfd5;padding:22px}.option{border:1px solid #d0d9cf;padding:18px;margin:12px 0}.option p{margin:6px 0 12px}.btn{display:inline-block;background:#162922;color:white;text-decoration:none;padding:13px 19px;border:0;font:600 14px system-ui;cursor:pointer}.btn:focus{outline:3px solid #9eac99}select,textarea{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;font:inherit}#message{font-weight:600}footer{font-size:12px;color:#56665c;margin-top:35px}@media(max-width:740px){main{margin:0;padding:24px 18px}}</style></head>
<body><main><div class="eyebrow">YOUR MIND STORY</div><h1 class="title">Your personalised assessment result</h1><p id="status">Retrieving your saved result.</p><div id="result" hidden></div><footer>These results reflect the answers you gave. They are not a diagnosis or a substitute for medical or mental health care.</footer></main>
<script>
(()=>{
'use strict';
const api='__SET_ISOLATED_APPS_SCRIPT_DEV_URL__';
const token=(new URLSearchParams(location.search).get('resultToken')||new URLSearchParams(location.search).get('token')||'').trim();
const status=document.getElementById('status'),view=document.getElementById('result');
const stages=['Quiet the Alarm','Break the Pull','Restore Self-Trust','Return to Yourself'];
const links={
'Quiet the Alarm':'https://stan.store/Yourmindstory/p/quiet-the-alarm',
'Break the Pull':'https://stan.store/Yourmindstory/p/break-the-pull',
'Restore Self-Trust':'https://stan.store/Yourmindstory/p/restore-self-trust',
'Return to Yourself':'https://stan.store/Yourmindstory/p/return-to-yourself-7jc9h8lg',
'Quiet the Alarm → Break the Pull':'https://stan.store/Yourmindstory/p/quiet-the-alarm--break-the-pull',
'Quiet the Alarm → Restore Self-Trust':'https://stan.store/Yourmindstory/p/quiet-the-alarm--restore-selftrust',
'Quiet the Alarm → Return to Yourself':'https://stan.store/Yourmindstory/p/quiet-the-alarm--return-to-yourself',
'Break the Pull → Restore Self-Trust':'https://stan.store/Yourmindstory/p/break-the-pull--restore-selftrust',
'Break the Pull → Return to Yourself':'https://stan.store/Yourmindstory/p/break-the-pull--return-to-yourself',
'Restore Self-Trust → Return to Yourself':'https://stan.store/Yourmindstory/p/restore-selftrust--return-to-yourself',
'The Bare Minimum':'https://stan.store/Yourmindstory/p/the-bare-minimum'
};
const complete=[
{id:'self_guided',title:'Return to Yourself · Self-Guided',price:117,desc:'Four stages of guided Cognitive Behavioural Hypnotherapy, with a structured practice to work through at your own pace.',url:'https://stan.store/Yourmindstory/p/return-to-yourself-eli637kx'},
{id:'reality_reset',title:'Return to Yourself + Reality Reset',price:147,desc:'The complete four-stage programme, workbook and private 20-minute session.',url:'https://stan.store/Yourmindstory/p/return-to-yourself-reality-reset'},
{id:'pattern_break',title:'Return to Yourself + Pattern Break',price:197,desc:'The complete four-stage programme, workbook and private 50-minute CBT session.',url:'https://stan.store/Yourmindstory/p/return-to-yourself-pattern-break'}
];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={data:null};
const trackFirstParty=(events)=>{
 try{
  const body=JSON.stringify({action:'recordJourneyEvents',resultToken:token,page:'saved_result',events:events.map(e=>({eventType:e[0],values:e[1]||{},clientTime:new Date().toISOString()}))});
  if(navigator.sendBeacon){const sent=navigator.sendBeacon(api,new Blob([body],{type:'text/plain;charset=UTF-8'}));if(sent)return;}
  fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,keepalive:true,referrerPolicy:'no-referrer'}).catch(()=>{});
 }catch(e){}
};
const trackAnalytics=(name,params={})=>{
 try{
  if(localStorage.getItem('yms_analytics_consent')!=='yes')return;
  const extra=Object.assign({assessment_version:'YMS-ASSESSMENT-2026-V3',surface:'saved_result'},params);
  if(window.YMSQuiz&&YMSQuiz.track)YMSQuiz.track(name,extra);
  else if(typeof window.gtag==='function')window.gtag('event',name,extra);
 }catch(e){}
};

if(!/^[A-Za-z0-9_-]{20,128}$/.test(token)){status.textContent='This result link is incomplete. Please use the link in your assessment email.';return;}
fetch(api+'?action=getResult&resultToken='+encodeURIComponent(token),{credentials:'omit',referrerPolicy:'no-referrer'}).then(r=>r.json()).then(d=>{
 if(!d.ok||!d.recommendedProduct)throw Error('This result could not be retrieved. Please contact Your Mind Story.');
 state.data=d;status.textContent='Your saved result has loaded.';
 const all=d.scores||{};
 const arr=[all.quiet,all.breakPull,all.restore,all.returnSelf];
 const strength=arr.map((v,i)=>({score:Number(v)||0,label:stages[i]})).filter(x=>x.score>=3);
 const stageText=strength.length?strength.map(x=>'<p><strong>'+esc(x.label)+'</strong></p>').join(''):'<p>Your answers did not indicate a strong concentration in one specific stage.</p>';
 const isComplete=d.recommendedRoute==='Return to You Series';
 let offer='';
 if(isComplete){offer='<div class="option"><h2>Your support choice</h2><p>Continue to the questions that will help match the recommendation to the support you want.</p><button type="button" class="btn" id="start-choice">CONTINUE</button></div>'}
 else {const price=d.recommendedProduct==='The Bare Minimum'?4.99:d.recommendedRoute==='Two-Stage Pair'?74:37;const url=links[d.recommendedProduct];if(url)offer='<div class="option"><h2>'+esc(d.recommendedProduct)+' · £'+price+'</h2><button type="button" class="btn" id="start-choice">CONTINUE WITH MY RECOMMENDATION</button></div>';}
 view.innerHTML='<p class="muted">For '+esc(d.firstName||'you')+'</p><div class="panel"><h2>Where this cycle may be affecting you</h2><p>Your answers point to these areas:</p>'+stageText+'<p>The next step is to practise responding differently when these feelings and habits are activated, not simply to understand his behaviour.</p></div><h2>Your recommended next step</h2><p>'+esc(d.recommendedProduct)+'</p>'+offer+'<div id="decision" hidden class="panel"></div>';
 view.hidden=false;trackFirstParty([['result_view',{entry:'result_email_saved_link'}]]);trackAnalytics('quiz_result_view',{recommendation_category:isComplete?'return_to_you_series':d.recommendedRoute});
 const savedOption=d.finalOfferOption||'';
 if(savedOption&&d.resultEmailState==='sent'){showSavedCheckout(savedOption)}
 else {document.getElementById('start-choice').onclick=()=>showDecision();if(savedOption)showDecision()}
}).catch(err=>{status.textContent=String(err.message||err)});
function showSavedCheckout(option){
 const d=state.data;let dest='';
 if(option==='scored_route')dest=links[d.recommendedProduct]||'';
 else {const selected=complete.find(x=>x.id===option);dest=selected?selected.url:''}
 const box=document.getElementById('decision');box.hidden=false;
 box.innerHTML='<h2>Your choice is saved</h2><p>'+esc(d.finalOfferProduct||d.recommendedProduct)+'</p>'+
  (dest?'<p><a class="btn" href="'+esc(dest)+'" rel="noopener noreferrer">CONTINUE TO CHECKOUT</a></p>':'');
}
function showDecision(){
 const d=state.data;if(!d)return;
 const isComplete=d.recommendedRoute==='Return to You Series';
 const scores=Object.values(d.scores||{}).map(Number);
 const needsReady=isComplete&&scores.filter(x=>x>=3).length>=3&&scores.reduce((a,b)=>a+b,0)>=15;
 const priorOption=d.finalOfferOption||'',priorSupport=d.supportChoiceId||'';
 const box=document.getElementById('decision');box.hidden=false;
 const readinessOptions=[
  "I know understanding alone isn't enough and I'm ready to start working on this.",
  "I'm ready for a structured process and willing to participate in it consistently.",
  "I know something needs to change, but I'm not sure I'm ready to actively work on it yet.",
  "Right now, I'm mainly looking to understand what is happening."
 ];
 box.innerHTML=(needsReady?'<label for="ready"><strong>Where are you in your readiness to work on this?</strong></label><select id="ready"><option value="">Choose one</option>'+readinessOptions.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>':'')+
  (isComplete?'<h2>One more thing.</h2><p>This pattern didn&#39;t develop overnight, and changing how you respond to it takes practice.</p><p>Meaningful change happens through small, consistent steps. That&#39;s why Return to Yourself is designed to guide you over the next 12 weeks, helping you build new responses and stay on track as you return to yourself.</p><p>Your main job is simple: press play each day and complete a short weekly check-in with me.</p><p><strong>Would you like more personal support than this?</strong></p><div id="support-choices"></div><div id="offer-choices"></div>':'<div id="offer-choices"></div>')+
  '<p id="message" role="status"></p>';
 const supportOptions=[
  {id:'independent',label:"I'm happy to work independently"},
  {id:'additional',label:'I want additional support'},
  {id:'some',label:'I think some support would help me with this'},
  {id:'unsure',label:"I'm not sure where to start. I'd like you to recommend what would help me most."}
 ];
 const supportEl=document.getElementById('support-choices');
 const offersEl=document.getElementById('offer-choices');
 let selectedSupport=priorSupport;
 if(isComplete&&supportEl){
  supportEl.innerHTML=supportOptions.map(x=>'<label class="option"><input type="radio" name="support-choice" value="'+x.id+'" '+(x.id===selectedSupport?'checked':'')+'> '+esc(x.label)+'</label>').join('');
  supportEl.onchange=()=>{const input=supportEl.querySelector('input[name="support-choice"]:checked');selectedSupport=input?input.value:'';renderOffers()};
 }
 const routeOffers={
  self_guided:{id:'self_guided',product:'Return to Yourself — Self-Guided',route:'Self-Guided',price:117,url:'https://stan.store/Yourmindstory/p/return-to-yourself-eli637kx',title:'Return to Yourself — Self-Guided',desc:'The complete four-stage programme, with the guided sessions and weekly check-ins.'},
  reality_reset:{id:'reality_reset',product:'Return to Yourself + Reality Reset',route:'Reality Reset',price:147,url:'https://stan.store/Yourmindstory/p/return-to-yourself-reality-reset',title:'Return to Yourself + Reality Reset',desc:'Everything in the self-guided programme, plus the workbook and a private 20-minute conversation with Onye.'},
  pattern_break:{id:'pattern_break',product:'Return to Yourself + Pattern Break Session',route:'Pattern Break Session',price:197,url:'https://stan.store/Yourmindstory/p/return-to-yourself-pattern-break',title:'Return to Yourself + Pattern Break Session',desc:'Everything in the self-guided programme, plus the workbook and a private 50-minute solution-focused CBT session with Onye.'}
 };
 function renderOffers(){
  if(!offersEl)return;
  let options=[];
  if(!isComplete)options=[{id:'scored_route',product:d.recommendedProduct,route:d.recommendedRoute,price:Number(d.recommendedPrice)|| (d.recommendedProduct==='The Bare Minimum'?4.99:d.recommendedRoute==='Two-Stage Pair'?74:37),url:links[d.recommendedProduct],title:d.recommendedProduct,desc:''}];
  else if(selectedSupport==='independent')options=[routeOffers.self_guided];
  else if(selectedSupport==='additional'||selectedSupport==='some')options=[routeOffers.reality_reset,routeOffers.pattern_break];
  else if(selectedSupport==='unsure')options=[routeOffers.reality_reset,routeOffers.self_guided,routeOffers.pattern_break];
  if(priorOption)options=options.filter(x=>x.id===priorOption);
  const primary=selectedSupport==='independent'?'self_guided':'reality_reset';
  offersEl.innerHTML=options.map(x=>'<div class="option"><h2>'+esc(x.title)+' · £'+x.price+'</h2><p>'+esc(x.desc||'')+'</p><button type="button" class="btn finalize-choice" data-id="'+x.id+'" data-product="'+esc(x.product)+'" data-route="'+esc(x.route)+'" data-price="'+x.price+'" data-url="'+esc(x.url)+'">'+(x.id===primary?'PRIMARY RECOMMENDATION':'CHOOSE THIS OPTION')+'</button></div>').join('');
  offersEl.querySelectorAll('.finalize-choice').forEach(b=>b.onclick=()=>finalizeChoice(b));
 }
 async function finalizeChoice(button){
  const readiness=needsReady?document.getElementById('ready').value:'';
  if(needsReady&&!readiness){document.getElementById('message').textContent='Please choose your readiness answer.';return}
  if(isComplete&&!selectedSupport){document.getElementById('message').textContent='Please choose the support answer that fits you best.';return}
  button.disabled=true;
  const option=button.dataset.id,product=button.dataset.product,route=button.dataset.route,price=Number(button.dataset.price),dest=button.dataset.url;
  try{
   const body={action:'finalizeResultV3',resultToken:token,finalOfferOption:option,finalOfferProduct:product,finalOfferRoute:route,finalOfferPrice:price,supportPreference:selectedSupport,readiness:readiness};
   const res=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),referrerPolicy:'no-referrer'});
   const result=await res.json();
   if(!result||!result.ok||!result.resultEmailSent)throw Error(result&&result.message?result.message:'The final choice and matching email could not be confirmed. Please retry.');
   d.finalOfferOption=option;d.finalOfferProduct=product;d.resultEmailState='sent';d.supportChoiceId=selectedSupport;
   document.getElementById('message').innerHTML='Your final choice is saved and its matching result email has been accepted. <a class="btn" href="'+esc(dest)+'" rel="noopener noreferrer">CONTINUE TO CHECKOUT</a>';
   const checkout=document.querySelector('#message a.btn');
   if(checkout)checkout.addEventListener('click',()=>{
    const v={product:product,route:d.recommendedRoute,price:price,currency:'GBP',destination:'stan.store',source:'saved_result'};
    trackFirstParty([['primary_cta_click',v],['outbound_stan_click',v]]);
    trackAnalytics('recommendation_click',{route:d.recommendedRoute,product_type:isComplete?'return_to_you_series':'stage_or_pair'});
   });
  }catch(e){document.getElementById('message').textContent=String(e.message||e);button.disabled=false}
 }
 if(!isComplete||selectedSupport)renderOffers();
}
})();
</script><script src="/assets/yms-consent.js?v=20261001-tracking" defer></script><script>(function(){try{if(localStorage.getItem('yms_analytics_consent')==='yes'){var s=document.createElement('script');s.src='/assets/yms-quiz-shared.js';s.async=true;document.head.appendChild(s)}}catch(e){}})();</script></body></html>
