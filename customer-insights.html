<html lang="en">

<style>
:root{--bg:#F2EFE8;--fg:#1A0A2E;--rule:rgba(26,10,46,0.08);--muted:#1A0A2E;--dim:rgba(26,10,46,0.50);--accent:#8A5A6B;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}
.page{display:flex;flex-direction:column;align-items:center;padding:0 24px 100px;}
@media(min-width:768px){.page{padding:0 24px 100px;}}
.inner{width:100%;max-width:580px;}
.hdr{padding-top:48px;padding-bottom:28px;text-align:center;border-bottom:1px solid var(--rule);margin-bottom:40px;}
.hdr.compact{padding-top:28px;padding-bottom:18px;margin-bottom:28px;}
.wm{font-family:'Gilda Display',serif;font-size:clamp(13px,3vw,16px);letter-spacing:0.24em;text-transform:uppercase;color:var(--dim);display:block;text-align:center;}
.progress{margin-bottom:36px;}
.progress-label{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.progress-bg{width:100%;height:1px;background:var(--rule);}
.progress-fill{height:1px;background:var(--fg);transition:width 0.4s ease,background 0.4s ease;}
.progress-fill.stage2{background:var(--accent);}
.btn-back{display:none;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.08em;color:var(--dim);background:none;border:none;cursor:pointer;padding:8px 0;text-transform:uppercase;margin-bottom:8px;}
.btn-back::before{content:'\2190 ';}
.eyebrow{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.10em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;}
.q-text{display:block;font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(21px,5.2vw,28px);line-height:1.25;color:var(--fg);margin-bottom:26px;}
.encourage{display:block;font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(14px,3.4vw,16px);color:var(--accent);margin-bottom:20px;}
.intro-head{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(24px,6vw,34px);line-height:1.15;color:var(--fg);display:block;margin-bottom:22px;}
.intro-body{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.6vw,17px);line-height:1.85;color:var(--muted);display:block;}
.intro-body+.intro-body{margin-top:14px;}
.save-notice{font-family:'DM Sans',sans-serif;font-weight:300;font-size:13px;line-height:1.7;color:var(--dim);display:block;margin-top:18px;font-style:italic;}
.btn-row{margin-top:30px;display:flex;flex-direction:column;gap:14px;}
.btn-primary{display:block;width:100%;font-family:'DM Sans',sans-serif;font-weight:400;font-size:clamp(11px,2.6vw,13px);letter-spacing:0.15em;text-transform:uppercase;color:var(--bg);background:var(--fg);border:none;padding:20px 32px;cursor:pointer;text-decoration:none;text-align:center;transition:opacity 0.2s;}
.btn-primary:hover{opacity:0.82;}
.btn-primary:disabled{opacity:0.32;cursor:not-allowed;}
.btn-skip{background:none;border:none;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);cursor:pointer;padding:6px 0;text-decoration:underline;}
.btn-skip:hover{color:var(--fg);}
fieldset{border:none;padding:0;margin:0;}
legend{padding:0;width:100%;float:left;}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
.opt{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border:1px solid var(--rule);cursor:pointer;transition:border-color 0.2s,background 0.2s;}
.opt:hover{border-color:rgba(26,10,46,0.25);}
.opt.selected{border-color:var(--fg);background:rgba(26,10,46,0.04);}
.opt input{position:absolute;opacity:0;width:1px;height:1px;}
.opt input:focus-visible ~ .dot{outline:2px solid var(--fg);outline-offset:2px;}
.dot{width:14px;height:14px;min-width:14px;border:1px solid rgba(26,10,46,0.28);border-radius:50%;margin-top:3px;transition:border-color 0.2s,background 0.2s;}
.opt.selected .dot{background:var(--fg);border-color:var(--fg);}
.opt.cb .dot{border-radius:2px;}
.opt-text{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(14px,3.2vw,15px);line-height:1.6;color:rgba(26,10,46,0.75);}
.opt.selected .opt-text{color:var(--fg);}
textarea.q-input, input.q-input{width:100%;background:rgba(26,10,46,0.02);border:1px solid var(--rule);border-bottom:1px solid rgba(26,10,46,0.22);color:var(--fg);font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.5vw,16px);line-height:1.7;padding:16px 18px;outline:none;resize:none;transition:border-color 0.2s;margin-bottom:8px;margin-top:10px;}
textarea.q-input{min-height:110px;}
textarea.q-input:focus, input.q-input:focus{border-color:rgba(26,10,46,0.4);}
textarea.q-input::placeholder, input.q-input::placeholder{color:rgba(26,10,46,0.28);font-style:italic;}
.scale-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.scale-btn{width:44px;height:44px;border:1px solid var(--rule);background:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--fg);cursor:pointer;transition:border-color 0.2s,background 0.2s;}
.scale-btn.selected{border-color:var(--fg);background:var(--fg);color:var(--bg);}
.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:24px;}
.close-wrap{text-align:center;padding:40px 0;}
.close-head{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(24px,6vw,32px);color:var(--fg);display:block;margin-bottom:18px;line-height:1.3;}
.close-body{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.5vw,16px);line-height:1.85;color:var(--muted);display:block;margin-bottom:34px;}
.signature{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(14px,3.2vw,15px);color:var(--dim);display:block;margin-top:28px;}
footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:10px;}
.footer-links{display:flex;gap:28px;}
.footer-links a{font-family:'DM Sans',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.10em;text-transform:uppercase;color:rgba(26,10,46,0.55);text-decoration:none;}
:focus-visible{outline:1px solid rgba(26,10,46,0.4);outline-offset:4px;}
</style>
</head>
<body>
<main class="page" role="main">
<div class="inner">
<header class="hdr" id="hdr">
<span class="wm">Your Mind Story</span>
</header>
<div class="progress" id="progress" style="display:none;">
<span class="progress-label" id="prog-label">Section 1 of 2</span>
<div class="progress-bg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="prog-bg"><div class="progress-fill" id="prog-fill" style="width:2%"></div></div>
</div>
<button type="button" class="btn-back" id="back-btn" onclick="goBack()">Back</button>
<div id="app"></div>
</div>
</main>
<script>
/* ============ CONFIG ============ */
var SHEET = 'https://script.google.com/macros/s/AKfycbxMP4TxB9UsY1i8WuNsZjgj-BmMo0o6dAKu3OAKCDl1CrfDm7218CH5UvNXoWyjfViK/exec';
var BOOK_URL = 'https://payhip.com/b/ZcdmX';
var BOOK_CODE = 'INSIGHTS100';
var VARIANT = null;
var responseId = null;

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

function getMeta() {
  var qs = new URLSearchParams(location.search);
  var traffic = qs.get('utm_source') || qs.get('src') || '';
  if (!traffic && document.referrer) {
    try { traffic = new URL(document.referrer).hostname; } catch(e) {}
  }
  return { traffic_source: traffic || '' };
}

/* ============ QUESTIONS ============ */
var CORE = [
  {id:'q1', type:'options', required:true, q:'How did you find me?', key:'q1_how_found',
    options:['TikTok','Instagram','Facebook','Google','A friend','Other']},
  {id:'q2', type:'text', required:false, q:'What were you hoping Your Mind Story could help you achieve?', key:'q2_hoped_outcome',
    placeholder:'I was hoping it could help me...'},
  {id:'q3', type:'text', required:true, q:'Imagine you’re telling a friend about Your Mind Story. What would you say it does?', key:'q3_friend_explain',
    placeholder:'I’d tell her it’s...'},
  {id:'q4', type:'options', required:true, q:'Did you consider buying anything today?', key:'q4_branch', branch:true,
    options:['I bought something today','I seriously considered buying, but didn’t','I looked at the products, but wasn’t close to buying','I didn’t consider buying anything']}
];

var BRANCH_MAP = {
  'I bought something today': 'bought',
  'I seriously considered buying, but didn’t': 'serious',
  'I looked at the products, but wasn’t close to buying': 'browsed',
  'I didn’t consider buying anything': 'never'
};

var BRANCH_QUESTIONS = {
  bought: [
    {id:'bq1', type:'options', required:true, otherOption:true, q:'What mattered most in your decision to buy?', key:'principal_factor',
      options:['The price felt fair','I trusted it would work for me','It felt relevant to my exact situation','I’d waited long enough and decided to try it','Something else']},
    {id:'bq2', type:'options', required:false, otherOption:true, q:'What nearly stopped you from buying?', key:'near_miss_reason',
      options:['Price','Wasn’t sure it would work for me','Wanted more proof first','Timing','Nothing really','Something else']},
    {id:'bq3', type:'text', required:false, q:'What could have made the buying experience easier?', key:'buying_experience',
      placeholder:'It would have helped if...'}
  ],
  serious: [
    {id:'bq1', type:'options', required:true, otherOption:true, q:'What was the single biggest reason you didn’t buy?', key:'principal_barrier',
      options:['I wasn’t convinced it would work for me','I wasn’t sure which product was right for me','I wanted more proof or evidence','The price felt too high for what I’d get','I wasn’t ready to decide today','Something else']},
    {id:'bq2', type:'text', required:false, q:'What question were you still trying to answer?', key:'still_deciding_question',
      placeholder:'I was still trying to work out whether...'},
    {id:'bq3', type:'options', required:false, q:'How did the price feel?', key:'price_feel',
      options:['Excellent value','Good value','About right','Slightly expensive','Too expensive']}
  ],
  browsed: [
    {id:'bq1', type:'options', required:true, otherOption:true, q:'Which was the single biggest reason you didn’t continue?', key:'principal_barrier',
      options:['It didn’t feel relevant to my situation','I wasn’t convinced it would work for me','I wanted more proof or evidence','The price put me off','It wasn’t the right time','Something else']},
    {id:'bq2', type:'text', required:false, q:'What stopped the products from feeling right for you?', key:'not_right_reason',
      placeholder:'It felt like...'},
    {id:'bq3', type:'text', required:false, q:'What were you hoping to see instead?', key:'hoped_to_see',
      placeholder:'I was hoping to see...'}
  ],
  never: [
    {id:'bq1', type:'options', required:true, q:'Did the result feel relevant to your situation?', key:'relevance',
      options:['Yes, very relevant','Somewhat relevant','Not really relevant','Not sure']},
    {id:'bq2', type:'options', required:false, otherOption:true, q:'What stopped you from wanting to explore the products?', key:'exploration_barrier',
      options:['Didn’t feel like it applied to me','Wasn’t sure what I’d actually get','Wasn’t ready to commit to anything','Didn’t trust it would work','Something else']},
    {id:'bq3', type:'text', required:false, q:'What, if anything, would have made you want to learn more?', key:'learn_more_trigger',
      placeholder:'It would help if...'}
  ]
};

var CORE_TAIL = [
  {id:'cq_change', type:'text', required:false, q:'If you could change one thing about Your Mind Story, what would it be?', key:'change_one_thing',
    placeholder:'I’d change...'},
  {id:'cq_anything', type:'text', required:false, q:'Is there anything I should have asked that I didn’t?', key:'anything_else',
    placeholder:'You could have asked me...'}
];

var STAGE2INTRO = {id:'stage2intro', type:'stage2intro'};

var STAGE2 = [
  {id:'s2_confidence', type:'options', required:false, multi:true, q:'Which of these would help you feel more confident?', key:'confidence_helpers',
    options:['More customer stories','More before-and-after experiences','More information about how the audios work','More information about me','Scientific evidence','A money-back guarantee','More sample audio','Something else']},
  {id:'s2_expected', type:'text', required:false, q:'Was there anything you expected to see that wasn’t there?', key:'expected_missing',
    placeholder:'No, or... yes, I expected to see'},
  {id:'s2_accuracy', type:'scale', required:false, q:'Did the quiz describe you accurately?', key:'quiz_accuracy_score', scaleMax:10},
  {id:'s2_accurate', type:'text', required:false, q:'What part felt most accurate?', key:'accurate_part',
    placeholder:'The part about...'},
  {id:'s2_inaccurate', type:'text', required:false, q:'What part felt inaccurate, if anything?', key:'inaccurate_part',
    placeholder:'None, or... the part about'},
  {id:'s2_unclear', type:'options', required:false, q:'What, if anything, felt unclear?', key:'unclear', unclearFollow:true,
    options:['No, it was all clear','Yes, something felt unclear']},
  {id:'s2_unclear_where', type:'options', required:false, q:'Where did it feel unclear?', key:'unclear_where',
    options:['Homepage','Quiz','Results page','Product pages','Checkout','Emails']},
  {id:'s2_recall', type:'text', required:false, dynamicRecall:true, key:'outcome_blocker',
    placeholder:'I think what’s been in the way is...'},
  {id:'s2_comeback', type:'text', required:false, dynamicComeback:true, key:'comeback_reason',
    placeholder:'...'},
  {id:'s2_oneday', type:'text', required:false, q:'If you were in charge of Your Mind Story for one day, what’s the first thing you’d change?', key:'one_day_change',
    placeholder:'The first thing I’d change is...'},
  {id:'s2_wand', type:'text', required:false, dynamicWand:true, key:'magic_wand',
    placeholder:'It would be...'}
];

var CLOSE = {id:'close', type:'close'};
/* ============ ENGINE STATE ============ */
var STEP_DEFS = {};
CORE.concat(CORE_TAIL).concat(STAGE2).concat([STAGE2INTRO, CLOSE]).forEach(function(s){ STEP_DEFS[s.id] = s; });

var answers = {};
var order = [];
var histIdx = [];
var cur = -1;
var totalCore = 0;
var lastViewed = null;
var lastAnswered = null;
var status = 'not_started';
var submitted = false;

function stepById(id) { return STEP_DEFS[id]; }

function buildInitialOrder() {
  order = ['q1','q2','q3','q4','cq_change','cq_anything','stage2intro','s2_confidence','s2_expected','s2_accuracy','s2_accurate','s2_inaccurate','s2_unclear','s2_recall','s2_comeback','s2_oneday','s2_wand','close'];
}

function startInterview() {
  responseId = uuid();
  buildInitialOrder();
  cur = 0;
  histIdx = [];
  status = 'started';
  gtag('event','interview_start',{});
  render();
  saveProgress();
}

function insertBranchQuestions() {
  var variant = BRANCH_MAP[answers.q4_branch];
  VARIANT = variant;
  var qs = BRANCH_QUESTIONS[variant] || [];
  qs.forEach(function(q){ STEP_DEFS[q.id] = q; });
  var idx = order.indexOf('q4');
  var ids = qs.map(function(q){ return q.id; });
  order.splice.apply(order, [idx+1, 0].concat(ids));
  totalCore = order.indexOf('stage2intro');
  gtag('event','interview_branch',{branch:VARIANT});
}

function saveProgress() {
  if (!responseId) return;
  var payload = {
    responseId: responseId,
    branch: VARIANT || '',
    status: status,
    lastQuestionViewed: lastViewed || '',
    lastQuestionAnswered: lastAnswered || '',
    answers: answers,
    meta: getMeta(),
    ts: new Date().toISOString()
  };
  try {
    var body = JSON.stringify(payload);
    if (navigator.sendBeacon) {
      var blob = new Blob([body], {type:'text/plain;charset=UTF-8'});
      navigator.sendBeacon(SHEET, blob);
    } else {
      fetch(SHEET, {method:'POST', mode:'no-cors', keepalive:true, body: body});
    }
  } catch(e) {}
}

function dynamicText(step) {
  if (step.dynamicRecall) {
    if (VARIANT === 'bought') return 'What almost stopped you from buying?';
    if (answers.q2_hoped_outcome && answers.q2_hoped_outcome.trim().length > 0) {
      return 'Earlier, you described the change you were hoping for. What do you think has been getting in the way?';
    }
    return 'Earlier, I asked what you hoped to change. What do you feel has been getting in the way?';
  }
  if (step.dynamicComeback) {
    return VARIANT === 'bought' ? 'What would make the experience even better?' : 'What would make you come back?';
  }
  if (step.dynamicWand) {
    return VARIANT === 'bought' ? 'If I could wave a magic wand and improve one thing about your experience, what would it be?' : 'If I could wave a magic wand and change one thing that would have made today perfect for you, what would it be?';
  }
  return step.q;
}

function esc(s) { return String(s).replace(/'/g, '\\\''); }
function render() {
  var app = document.getElementById('app');
  var html = '';

  if (cur === -1) {
    html += '<div class="intro-head">Help me make this actually work for you.</div>';
    html += '<div class="intro-body">I’m trying to understand exactly where women get stuck, so I can make Your Mind Story clearer and more helpful. This takes about 2 minutes, and there’s an optional second part if you want to tell me more.</div>';
    html += '<div class="intro-body">As a thank-you, you’ll receive a code at the end to download a free digital copy of my book, The Bare Minimum | The Five Non-Negotiables a Woman Needs to Stay Healthy in Love.</div>';
    html += '<div class="save-notice">Your answers are saved securely as you move through the interview, so you won’t lose your progress.</div>';
    html += '<div class="btn-row"><button type="button" class="btn-primary" onclick="startInterview()">Start</button></div>';
    app.innerHTML = html;
    updateChrome();
    return;
  }

  var id = order[cur];
  lastViewed = id;
  var step = stepById(id);

  if (step.type === 'stage2intro') {
    html += '<div class="intro-head">Thank you. That’s genuinely helpful already.</div>';
    html += '<div class="intro-body">If you’ve got a few more minutes, the questions below help me even more. Completely optional — you can also send everything now.</div>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn-primary" onclick="go(cur+1)">Keep going</button>';
    html += '<button type="button" class="btn-skip" onclick="go(order.indexOf(\'close\'))">Send what I’ve got</button>';
    html += '</div>';
  }
  else if (step.type === 'options') {
    var q = dynamicText(step);
    var eyebrowTxt = step.required ? 'A question' : 'Optional';
    html += '<fieldset class="opts-fieldset">';
    html += '<legend><span class="eyebrow">' + eyebrowTxt + '</span>' + (step.encourage ? '<span class="encourage">' + step.encourage + '</span>' : '') + '<span class="q-text">' + q + '</span></legend>';
    html += '<div class="opts" id="opts-' + step.id + '">';
    step.options.forEach(function(o) {
      var cls = step.multi ? 'opt cb' : 'opt';
      html += '<label class="' + cls + '" onclick="pick(this,\'' + step.id + '\',\'' + esc(o) + '\',' + !!step.multi + ')"><input type="' + (step.multi?'checkbox':'radio') + '" name="grp-' + step.id + '" onclick="event.stopPropagation()"><span class="dot"></span><span class="opt-text">' + o + '</span></label>';
    });
    html += '</div>';
    if (step.otherOption) {
      html += '<textarea class="q-input" id="other-' + step.id + '" style="display:none" placeholder="Tell me more..." oninput="onOtherInput(\'' + step.id + '\')"></textarea>';
    }
    html += '</fieldset>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn-primary" id="next-btn" onclick="advance()"' + (step.required ? ' disabled' : '') + '>Next</button>';
    if (!step.required) html += '<button type="button" class="btn-skip" onclick="skip()">Skip this one</button>';
    html += '</div>';
  }
  else if (step.type === 'text') {
    var q2 = dynamicText(step);
    html += '<span class="eyebrow">' + (step.required ? 'A question' : 'Optional') + '</span>';
    if (step.encourage) html += '<span class="encourage">' + step.encourage + '</span>';
    html += '<label class="q-text" for="in-' + step.id + '">' + q2 + '</label>';
    html += '<textarea class="q-input" id="in-' + step.id + '" rows="4" placeholder="' + (step.placeholder||'') + '" oninput="onTextInput(\'' + step.id + '\')"></textarea>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn-primary" id="next-btn" onclick="advance()"' + (step.required ? ' disabled' : '') + '>Next</button>';
    if (!step.required) html += '<button type="button" class="btn-skip" onclick="skip()">Skip this one</button>';
    html += '</div>';
  }
  else if (step.type === 'scale') {
    html += '<span class="eyebrow">Optional</span>';
    html += '<span class="q-text" id="scale-label-' + step.id + '">' + step.q + '</span>';
    html += '<div class="scale-row" id="scale-' + step.id + '" role="radiogroup" aria-labelledby="scale-label-' + step.id + '">';
    for (var n=1;n<=step.scaleMax;n++) html += '<button type="button" class="scale-btn" role="radio" aria-checked="false" onclick="pickScale(this,\'' + step.id + '\',' + n + ')">' + n + '</button>';
    html += '</div>';
    html += '<div class="scale-labels"><span>Not at all</span><span>Exactly me</span></div>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn-primary" id="next-btn" onclick="advance()">Next</button>';
    html += '<button type="button" class="btn-skip" onclick="skip()">Skip this one</button>';
    html += '</div>';
  }
  else if (step.type === 'close') {
    html += '<div class="close-wrap">';
    html += '<span class="close-head">Thank you. You’ve genuinely helped me improve something for the next woman.</span>';
    html += '<span class="close-body">As promised, here’s your code to download a free digital copy of The Bare Minimum | The Five Non-Negotiables a Woman Needs to Stay Healthy in Love.</span>';
    html += '<div style="margin:0 0 28px;padding:18px 22px;border:1px solid var(--rule);text-align:center;">';
    html += '<span style="display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;">Your code</span>';
    html += '<span style="display:block;font-family:\'Gilda Display\',serif;font-size:22px;letter-spacing:0.05em;color:var(--fg);margin-bottom:12px;">' + BOOK_CODE + '</span>';
    html += '</div>';
    html += '<button type="button" class="btn-primary" style="display:inline-block;max-width:340px;margin:0 auto;" onclick="claimBook(this)">Copy my code and get the book</button>';
    html += '<span class="signature">Onye</span>';
    html += '</div>';
  }

  app.innerHTML = html;

  if (step.type === 'options') restoreOptions(step);
  if (step.type === 'text') restoreText(step);
  if (step.type === 'scale') restoreScale(step);

  updateChrome();
}

function claimBook(btn) {
  try { navigator.clipboard.writeText(BOOK_CODE); } catch(e) {}
  gtag('event','book_claim_click',{variant:VARIANT});
  window.open(BOOK_URL, '_blank', 'noopener');
  btn.textContent = 'Code copied — check the new tab';
}
function restoreOptions(step) {
  var val = answers[step.key];
  if (!val) return;
  var vals = step.multi ? val.split(', ') : [val];
  document.querySelectorAll('#opts-' + step.id + ' .opt').forEach(function(l) {
    var text = l.querySelector('.opt-text').textContent;
    if (vals.indexOf(text) !== -1) l.classList.add('selected');
  });
  if (step.otherOption && vals.indexOf('Something else') !== -1) {
    var ta = document.getElementById('other-' + step.id);
    if (ta) { ta.style.display = 'block'; ta.value = answers[step.key + '_other'] || ''; }
  }
  if (step.required) {
    var btn = document.getElementById('next-btn');
    if (btn) btn.disabled = false;
  }
}
function restoreText(step) {
  var val = answers[step.key];
  var el = document.getElementById('in-' + step.id);
  if (el && val) el.value = val;
  if (step.required) {
    var btn = document.getElementById('next-btn');
    if (btn) btn.disabled = !(val && val.trim().length > 0);
  }
}
function restoreScale(step) {
  var val = answers[step.key];
  if (!val) return;
  document.querySelectorAll('#scale-' + step.id + ' .scale-btn').forEach(function(b) {
    if (b.textContent === val) { b.classList.add('selected'); b.setAttribute('aria-checked','true'); }
  });
}
function onTextInput(id) {
  var step = stepById(id);
  var val = document.getElementById('in-' + id).value;
  answers[step.key] = val;
  lastAnswered = id;
  if (step.required) {
    var btn = document.getElementById('next-btn');
    if (btn) btn.disabled = val.trim().length === 0;
  }
}
function onOtherInput(id) {
  var step = stepById(id);
  var val = document.getElementById('other-' + id).value;
  answers[step.key + '_other'] = val;
}
function pick(el, id, value, multi) {
  var step = stepById(id);
  if (!multi) {
    document.querySelectorAll('#opts-' + id + ' .opt').forEach(function(l){ l.classList.remove('selected'); });
    el.classList.add('selected');
    answers[step.key] = value;
  } else {
    el.classList.toggle('selected');
    var chosen = [];
    document.querySelectorAll('#opts-' + id + ' .opt.selected .opt-text').forEach(function(t){ chosen.push(t.textContent); });
    answers[step.key] = chosen.join(', ');
  }
  lastAnswered = id;
  if (step.otherOption) {
    var ta = document.getElementById('other-' + id);
    var isOther = (answers[step.key] || '').indexOf('Something else') !== -1;
    if (ta) ta.style.display = isOther ? 'block' : 'none';
  }
  if (step.required) {
    var btn = document.getElementById('next-btn');
    if (btn) btn.disabled = (answers[step.key] || '').length === 0;
  }
}
function pickScale(el, id, n) {
  document.querySelectorAll('#scale-' + id + ' .scale-btn').forEach(function(b){ b.classList.remove('selected'); b.setAttribute('aria-checked','false'); });
  el.classList.add('selected');
  el.setAttribute('aria-checked','true');
  answers[stepById(id).key] = String(n);
  lastAnswered = id;
}
function insertBranchFollowup() {
  var idx = order.indexOf('s2_unclear');
  var already = order.indexOf('s2_unclear_where') !== -1;
  if (answers['unclear'] === 'Yes, something felt unclear' && !already) {
    order.splice(idx+1, 0, 's2_unclear_where');
  } else if (already && answers['unclear'] !== 'Yes, something felt unclear') {
    order.splice(order.indexOf('s2_unclear_where'), 1);
  }
}
function advance() {
  var id = order[cur];
  if (id === 'q4') insertBranchQuestions();
  if (id === 's2_unclear') insertBranchFollowup();
  go(cur+1);
}
function skip() {
  var id = order[cur];
  if (id === 'q4') insertBranchQuestions();
  go(cur+1);
}
function go(n) {
  if (n >= order.length) n = order.length - 1;
  histIdx.push(cur);
  cur = n;
  var id = order[cur];
  if (id === 'stage2intro' && status === 'started') status = 'core_complete';
  if (id === 'close') status = 'optional_complete';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  saveProgress();
  if (id === 'close') finish();
}
function goBack() {
  if (histIdx.length === 0) return;
  cur = histIdx.pop();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateChrome() {
  var hdr = document.getElementById('hdr');
  var prog = document.getElementById('progress');
  var back = document.getElementById('back-btn');
  var progBg = document.getElementById('prog-bg');
  if (cur === -1) {
    hdr.classList.remove('compact');
    prog.style.display = 'none';
    back.style.display = 'none';
    return;
  }
  var id = order[cur];
  var step = stepById(id);
  hdr.classList.add('compact');
  back.style.display = (histIdx.length > 0 && step.type !== 'close') ? 'block' : 'none';
  if (step.type === 'close') { prog.style.display = 'none'; return; }
  prog.style.display = 'block';
  var fill = document.getElementById('prog-fill');
  var label = document.getElementById('prog-label');
  var stage2Start = order.indexOf('stage2intro');
  if (cur <= stage2Start) {
    var pct = Math.round((cur/stage2Start)*100);
    fill.style.width = pct + '%';
    fill.classList.remove('stage2');
    label.textContent = 'Section 1 of 2';
    progBg.setAttribute('aria-valuenow', pct);
  } else {
    var stage2Total = order.length - stage2Start - 2;
    var doneS2 = cur - stage2Start - 1;
    var pct2 = Math.round((doneS2/stage2Total)*100);
    fill.style.width = pct2 + '%';
    fill.classList.add('stage2');
    label.textContent = 'Optional — a few more, if you have a moment';
    progBg.setAttribute('aria-valuenow', pct2);
  }
}
function finish() {
  if (submitted) return;
  submitted = true;
  gtag('event','interview_complete',{variant:VARIANT});
}
render();
</script>
