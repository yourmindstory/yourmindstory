<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Mind Story</title>
  <meta name="description" content="When an avoidant loves you, your nervous system pays the price. Find out exactly what it is doing to yours.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0D0B14; --fg: #F2EFE8; --rule-color: rgba(242,239,232,0.07); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 40px;
      overflow-x: hidden;
    }
    .inner {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .a1 { opacity: 0; animation: up 0.9s ease forwards 0.10s; }
    .a2 { opacity: 0; animation: up 1.0s ease forwards 0.35s; }

    .wordmark {
      font-family: 'Gilda Display', serif;
      font-weight: 400;
      font-size: clamp(13px, 3.2vw, 16px);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--fg);
      margin-bottom: 48px;
    }

    .doors {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .door-btn {
      display: block;
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(11px, 2.6vw, 13px);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--fg);
      border: none;
      padding: 20px 24px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.2s ease;
    }
    .door-btn:hover { opacity: 0.86; }
    .door-btn:active { opacity: 0.70; }
    :focus-visible { outline: 1px solid rgba(242,239,232,0.4); outline-offset: 4px; }

    .credential-block {
      width: 100%;
      text-align: center;
      padding-top: 38px;
      padding-bottom: 30px;
    }
    .cred-name {
      display: block;
      font-family: 'Gilda Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(13px, 3vw, 15px);
      color: rgba(242,239,232,0.35);
      letter-spacing: 0.03em;
      margin-bottom: 5px;
    }
    .cred-title {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(9px, 2vw, 11px);
      letter-spacing: 0.10em;
      color: rgba(242,239,232,0.24);
      text-transform: uppercase;
    }

    footer {
      width: 100%;
      border-top: 1px solid var(--rule-color);
      padding: 30px 0 0;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .footer-links { display: flex; gap: 28px; }
    .footer-links a {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(242,239,232,0.25);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-links a:hover { color: rgba(242,239,232,0.50); }

    /* MENU */
    .menu-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      width: 40px;
      height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .menu-btn span {
      display: block;
      width: 22px;
      height: 1px;
      background: rgba(242,239,232,0.85);
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .menu-btn.open span:nth-child(2) { opacity: 0; }
    .menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .menu-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: min(78vw, 320px);
      background: #F2EFE8;
      border-left: 1px solid rgba(13,11,20,0.10);
      z-index: 99;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px;
      transform: translateX(100%);
      transition: transform 0.32s ease;
    }
    .menu-panel.open { transform: translateX(0); }
    .menu-panel a {
      font-family: 'Gilda Display', serif;
      font-style: italic;
      font-size: clamp(20px, 5vw, 26px);
      color: #0D0B14;
      text-decoration: none;
      display: block;
      margin-bottom: 30px;
      transition: opacity 0.2s ease;
    }
    .menu-panel a:hover { opacity: 0.65; }
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 98;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
    }
    .menu-overlay.open { opacity: 1; pointer-events: auto; }
  </style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0MFXQ5ETCD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-0MFXQ5ETCD');
</script>
</head>
<body>

<button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" onclick="toggleMenu()">
  <span></span><span></span><span></span>
</button>
<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<nav class="menu-panel" id="menuPanel" aria-label="Site menu">
  <a href="the-audios.html" onclick="gtag('event','menu_click',{'link':'shop'});">Shop</a>
  <a href="why-this-works.html" onclick="gtag('event','menu_click',{'link':'why_this_works'});">Why This Works</a>
  <a href="about.html" onclick="gtag('event','menu_click',{'link':'about'});">About</a>
</nav>

  <div class="inner">

    <div class="doors a2" style="margin-top:48px;">
      <a href="https://payhip.com/YourMindStory" class="door-btn" onclick="gtag('event','door_click',{'door':'shop'});">Your Mind Story</a>
      <a href="quiz-landing-page.html" class="door-btn" onclick="gtag('event','door_click',{'door':'quiz'});">Take the free quiz</a>
    </div>

    <div class="credential-block">
      <span class="cred-name">Onye</span>
      <span class="cred-title">Clinical Cognitive-Behavioural Hypnotherapist</span>
    </div>

    <footer role="contentinfo">
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="https://www.tiktok.com/@dontsleepwithavoidantmen" target="_blank" rel="noopener" onclick="gtag('event','footer_click',{'link':'tiktok'});">TikTok</a>
        <a href="about.html" onclick="gtag('event','footer_click',{'link':'about'});">About</a>
        <a href="the-audios.html" onclick="gtag('event','footer_click',{'link':'shop'});">Shop</a>
        <a href="privacy.html" onclick="gtag('event','footer_click',{'link':'privacy'});">Privacy</a>
      </nav>
    </footer>

  </div>

<script>
function toggleMenu(){
  document.getElementById('menuBtn').classList.toggle('open');
  document.getElementById('menuPanel').classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('open');
  var btn = document.getElementById('menuBtn');
  btn.setAttribute('aria-expanded', btn.classList.contains('open') ? 'true' : 'false');
}
</script>

</body>
</html>
