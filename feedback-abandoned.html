<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help me make this actually work for you - Your Mind Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

function gtag(){dataLayer.push(arguments);}

<style>
:root{--bg:#F2EFE8;--fg:#1A0A2E;--rule:rgba(26,10,46,0.08);--muted:#1A0A2E;--dim:rgba(26,10,46,0.50);--accent:#8A5A6B;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}
.page{display:flex;flex-direction:column;align-items:center;padding:0 24px 100px;}
@media(min-width:768px){.page{padding:0 24px 100px;}}
.inner{width:100%;max-width:580px;}
@keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.screen{display:none;}
.screen.active{display:block;animation:up 0.5s ease forwards;}
.hdr{padding-top:48px;padding-bottom:28px;text-align:center;border-bottom:1px solid var(--rule);margin-bottom:40px;}
.hdr.compact{padding-top:28px;padding-bottom:18px;margin-bottom:28px;}
.wm{font-family:'Gilda Display',serif;font-size:clamp(13px,3vw,16px);letter-spacing:0.24em;text-transform:uppercase;color:var(--dim);display:block;text-align:center;}

.progress{margin-bottom:36px;}
.progress-label{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.progress-bg{width:100%;height:1px;background:var(--rule);}
.progress-fill{height:1px;background:var(--fg);transition:width 0.4s ease;}

.btn-back{display:none;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.08em;color:var(--dim);background:none;border:none;cursor:pointer;padding:8px 0;text-transform:uppercase;margin-bottom:8px;}
.btn-back::before{content:'\2190 ';}

.eyebrow{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.10em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;}
.q-text{display:block;font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(21px,5.2vw,28px);line-height:1.25;color:var(--fg);margin-bottom:26px;}
.encourage{display:block;font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(14px,3.4vw,16px);color:var(--accent);margin-bottom:20px;}

.intro-head{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(24px,6vw,34px);line-height:1.15;color:var(--fg);display:block;margin-bottom:22px;}
.intro-body{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.6vw,17px);line-height:1.85;color:var(--muted);display:block;}
.intro-body+.intro-body{margin-top:14px;}

.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
.opt{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border:1px solid var(--rule);cursor:pointer;transition:border-color 0.2s,background 0.2s;}
.opt:hover{border-color:rgba(26,10,46,0.25);}
.opt.selected{border-color:var(--fg);background:rgba(26,10,46,0.04);}
.opt input{display:none;}
.dot{width:14px;height:14px;min-width:14px;border:1px solid rgba(26,10,46,0.28);border-radius:50%;margin-top:3px;transition:border-color 0.2s,background 0.2s;}
.opt.selected .dot{background:var(--fg);border-color:var(--fg);}
.opt-text{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(14px,3.2vw,15px);line-height:1.6;color:rgba(26,10,46,0.75);}
.opt.selected .opt-text{color:var(--fg);}

textarea.q-input{width:100%;background:rgba(26,10,46,0.02);border:1px solid var(--rule);border-bottom:1px solid rgba(26,10,46,0.22);color:var(--fg);font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.5vw,16px);line-height:1.7;padding:16px 18px;outline:none;resize:none;min-height:110px;transition:border-color 0.2s;margin-bottom:8px;}
textarea.q-input:focus{border-color:rgba(26,10,46,0.4);}
textarea.q-input::placeholder{color:rgba(26,10,46,0.28);font-style:italic;}

.btn-row{margin-top:30px;display:flex;flex-direction:column;gap:14px;}
.btn-primary{display:block;width:100%;font-family:'DM Sans',sans-serif;font-weight:400;font-size:clamp(11px,2.6vw,13px);letter-spacing:0.15em;text-transform:uppercase;color:var(--bg);background:var(--fg);border:none;padding:20px 32px;cursor:pointer;text-decoration:none;text-align:center;transition:opacity 0.2s;}
.btn-primary:hover{opacity:0.82;}
.btn-primary:disabled{opacity:0.32;cursor:not-allowed;}

.close-wrap{text-align:center;padding:40px 0;}
.close-head{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(24px,6vw,32px);color:var(--fg);display:block;margin-bottom:18px;line-height:1.3;}
.close-body{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.5vw,16px);line-height:1.85;color:var(--muted);display:block;margin-bottom:34px;}
.signature{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(14px,3.2vw,15px);color:var(--dim);display:block;margin-top:28px;}

footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:10px;}
.footer-links{display:flex;gap:28px;}
.footer-links a{font-family:'DM Sans',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.10em;text-transform:uppercase;color:rgba(26,10,46,0.55);text-decoration:none;}
:focus-visible{outline:1px solid rgba(26,10,46,0.4);outline-offset:4px;}
</style>
</head>
<body>
<main class="page" role="main">
<div class="inner">

<header class="hdr" id="hdr">
<span class="wm">Your Mind Story</span>
</header>

<div class="progress" id="progress" style="display:none;">
<span class="progress-label" id="prog-label">Question 1 of 3</span>
<div class="progress-bg"><div class="progress-fill" id="prog-fill" style="width:2%"></div></div>
</div>

<button type="button" class="btn-back" id="back-btn" onclick="goBack()">Back</button>

<div id="app"></div>

</div>
</main>

<script>
/* ============ CONFIG ============ */
var VARIANT = 'abandoned-quiz';
var SHEET = 'https://script.google.com/macros/s/AKfycbxMP4TxB9UsY1i8WuNsZjgj-BmMo0o6dAKu3OAKCDl1CrfDm7218CH5UvNXoWyjfViK/exec';
var BOOK_URL = 'https://payhip.com/b/ZcdmX';

function getMeta() {
  var qs = new URLSearchParams(location.search);
  var traffic = qs.get('utm_source') || qs.get('src') || '';
  if (!traffic && document.referrer) {
    try { traffic = new URL(document.referrer).hostname; } catch(e) {}
  }
  return {
    traffic_source: traffic || '',
    quiz_bucket: '',
    reached_results: 'no',
    product_clicked: '',
    cart_status: '',
    purchase_status: ''
  };
}

/* ============ STEPS ============ */
/* Shortest variant — only the three core questions from the content doc's
   "three versions" section: how she found me, what she was hoping to solve,
   and at what point she stopped (and why). No Stage 2, no branching. */
var STEPS = [
  {id:'intro', type:'intro'},
  {id:'q1', type:'options', q:'How did you find me?', key:'q1_how_found',
    options:['TikTok','Instagram','Facebook','Google','A friend','Other']},
  {id:'q2', type:'text', q:'What were you hoping Your Mind Story could help you solve?', key:'q2_hoped_outcome',
    placeholder:'I was hoping it could help me...'},
  {id:'q3', type:'text', q:'At what point did you stop, and why?', key:'abandoned_stop_point',
    placeholder:'I stopped around the question about... because...', encourage:'That’s really helpful.'},
  {id:'close', type:'close'}
];

/* ============ ENGINE ============ */
var answers = {};
var order = STEPS.map(function(s){return s.id;});
var histIdx = [];
var cur = 0;
var totalQ = STEPS.filter(function(s){return s.type!=='intro' && s.type!=='close';}).length;

function meta() { return getMeta(); }
function stepById(id) { for (var i=0;i<STEPS.length;i++) if (STEPS[i].id===id) return STEPS[i]; return null; }

function render() {
  var id = order[cur];
  var step = stepById(id);
  var app = document.getElementById('app');
  var html = '';

  if (step.type === 'intro') {
    html += '<div class="intro-head">Help me make this actually work for you.</div>';
    html += '<div class="intro-body">I’m trying to understand exactly where women get stuck, so I can make Your Mind Story clearer and more helpful. This takes under a minute.</div>';
    html += '<div class="intro-body">As a thank you, I’ll send you The Bare Minimum, my book on the five things your nervous system actually needs to stay well in love, free.</div>';
    html += '<div class="btn-row"><button type="button" class="btn-primary" onclick="gtag(\'event\',\'interview_start\',{variant:VARIANT});go(1)">Begin</button></div>';
  }
  else if (step.type === 'options') {
    html += '<span class="eyebrow">A question</span>';
    html += '<span class="q-text">' + step.q + '</span>';
    html += '<div class="opts" id="opts-' + step.id + '">';
    step.options.forEach(function(o) {
      html += '<label class="opt" onclick="pick(this,\'' + step.id + '\',\'' + esc(o) + '\')"><input type="radio"><span class="dot"></span><span class="opt-text">' + o + '</span></label>';
    });
    html += '</div>';
    html += '<div class="btn-row"><button type="button" class="btn-primary" id="next-btn" onclick="go(cur+1)" disabled>Next</button></div>';
  }
  else if (step.type === 'text') {
    if (step.encourage) html += '<span class="encourage">' + step.encourage + '</span>';
    html += '<span class="eyebrow">A question</span>';
    html += '<span class="q-text">' + step.q + '</span>';
    html += '<textarea class="q-input" id="in-' + step.id + '" rows="4" placeholder="' + (step.placeholder||'') + '" oninput="onTextInput(\'' + step.id + '\')"></textarea>';
    html += '<div class="btn-row"><button type="button" class="btn-primary" id="next-btn" onclick="go(cur+1)" disabled>Next</button></div>';
  }
  else if (step.type === 'close') {
    html += '<div class="close-wrap">';
    html += '<span class="close-head">Thank you. You’ve genuinely helped me improve something for the next woman.</span>';
    html += '<span class="close-body">As promised, here’s your copy of The Bare Minimum — the five things your nervous system actually needs to stay well in love.</span>';
    html += '<a class="btn-primary" style="display:inline-block;" href="' + BOOK_URL + '" target="_blank" rel="noopener" onclick="gtag(\'event\',\'book_claim_click\',{variant:VARIANT})">Get The Bare Minimum, free</a>';
    html += '<span class="signature">Onye</span>';
    html += '</div>';
  }

  app.innerHTML = html;
  if (step.type === 'options') restoreOptions(step);
  if (step.type === 'text') restoreText(step);
  updateChrome();
}

function esc(s) { return String(s).replace(/'/g, '\\\''); }

function restoreOptions(step) {
  var val = answers[step.key];
  if (!val) return;
  document.querySelectorAll('#opts-' + step.id + ' .opt').forEach(function(l) {
    if (l.querySelector('.opt-text').textContent === val) l.classList.add('selected');
  });
  var btn = document.getElementById('next-btn');
  if (btn) btn.disabled = false;
}
function restoreText(step) {
  var val = answers[step.key];
  var el = document.getElementById('in-' + step.id);
  if (el && val) el.value = val;
  var btn = document.getElementById('next-btn');
  if (btn) btn.disabled = !(val && val.trim().length > 0);
}

function onTextInput(id) {
  var step = stepById(id);
  var val = document.getElementById('in-' + id).value;
  answers[step.key] = val;
  var btn = document.getElementById('next-btn');
  if (btn) btn.disabled = val.trim().length === 0;
}

function pick(el, id, value) {
  var step = stepById(id);
  document.querySelectorAll('#opts-' + id + ' .opt').forEach(function(l){ l.classList.remove('selected'); });
  el.classList.add('selected');
  answers[step.key] = value;
  document.getElementById('next-btn').disabled = false;
}

function go(n) {
  if (n >= order.length) n = order.length - 1;
  histIdx.push(cur);
  cur = n;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  if (order[cur] === 'close') finish();
}

function goBack() {
  if (histIdx.length === 0) return;
  cur = histIdx.pop();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateChrome() {
  var id = order[cur];
  var step = stepById(id);
  var hdr = document.getElementById('hdr');
  var prog = document.getElementById('progress');
  var back = document.getElementById('back-btn');

  if (step.type === 'intro') {
    hdr.classList.remove('compact');
    prog.style.display = 'none';
    back.style.display = 'none';
    return;
  }
  hdr.classList.add('compact');
  back.style.display = (histIdx.length > 0 && step.type !== 'close') ? 'block' : 'none';

  if (step.type === 'close') { prog.style.display = 'none'; return; }

  prog.style.display = 'block';
  var doneCount = 0;
  for (var i=0;i<=cur;i++) { var s = stepById(order[i]); if (s.type!=='intro' && s.type!=='close') doneCount++; }
  document.getElementById('prog-fill').style.width = Math.round((doneCount/totalQ)*100) + '%';
  document.getElementById('prog-label').textContent = 'Question ' + doneCount + ' of ' + totalQ;
}

var submitted = false;
function finish() {
  if (submitted) return;
  submitted = true;
  var m = meta();
  var payload = Object.assign({variant: VARIANT}, m, answers);
  try {
    if (navigator.sendBeacon) {
      var blob = new Blob([JSON.stringify(payload)], {type:'text/plain;charset=UTF-8'});
      navigator.sendBeacon(SHEET, blob);
    } else {
      fetch(SHEET, {method:'POST', mode:'no-cors', keepalive:true, body: JSON.stringify(payload)});
    }
  } catch(e) {}
  gtag('event','interview_complete',{variant:VARIANT});
}

render();
</script>

<footer>
<nav class="footer-links">
<a href="https://www.tiktok.com/@dontsleepwithavoidantmen" target="_blank" rel="noopener">TikTok</a>
<a href="https://payhip.com/YourMindStory">Shop</a>
<a href="about.html">About</a>
<a href="privacy.html">Privacy</a>
</nav>
</footer>

</body>
</html>
