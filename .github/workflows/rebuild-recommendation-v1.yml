name: Rebuild Recommendation Engine V1
on:
  push:
    branches: [recommendation-engine-v1-rebuild]
    paths: ['.github/workflows/rebuild-recommendation-v1.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recommendation-engine-v1-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/rebuild_recommendation_v1.py
      - run: node --check assets/yms-quiz-shared.js
      - name: Commit rebuilt files
        run: |
          git config user.name "YMS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add quiz.html assets/yms-quiz-shared.js quiet-the-alarm.html break-the-pull.html restore-self-trust.html return-to-yourself.html mixed-result.html
          git commit -m "Rebuild YMS recommendation engine V1"
          git push origin recommendation-engine-v1-rebuild
