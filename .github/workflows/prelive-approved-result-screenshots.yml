name: Build prelive approved-result screenshots

on:
  push:
    branches:
      - exact-approved-result-flow-20260919
    paths:
      - '.github/workflows/prelive-approved-result-screenshots.yml'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render branch result pages
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          mkdir -p prelive-screenshots
          cat > screenshots.js <<'NODE'
          const { chromium } = require('playwright');
          const BASE='http://127.0.0.1:4173';
          const order=['Quiet the Alarm','Break the Pull','Restore Self-Trust','Return to Yourself'];
          function payload(stages,scores){
            const stageScores={};
            order.forEach(s=>stageScores[s]=scores[s] ?? (stages.includes(s)?3:0));
            return {
              firstName:'Kaci',
              resultType:stages.length===0?'no_clear_leader':(stages.length===1?'single':'mixed'),
              primaryResult:stages.length===1?stages[0]:null,
              leadingPatterns:stages.slice(0,2),
              secondaryActivePatterns:stages.slice(2),
              activeStages:stages.slice(),
              qualifyingStages:stages.slice(),
              stageScores,
              totalFourStageScore:Object.values(stageScores).reduce((a,b)=>a+b,0),
              breadthCount:stages.length,
              recommendationLevel:stages.length===0?'bare_minimum':(stages.length<=2?'audio_first':'complete_self_guided'),
              resultToken:'PRELIVE-TEST-ONLY'
            };
          }
          async function shot(browser,name,data,file){
            const ctx=await browser.newContext({viewport:{width:430,height:900},deviceScaleFactor:1});
            await ctx.addInitScript(p=>sessionStorage.setItem('yms_quiz_result',JSON.stringify(p)),data);
            const page=await ctx.newPage();
            await page.goto(BASE+'/'+file,{waitUntil:'networkidle'});
            await page.screenshot({path:'prelive-screenshots/'+name+'.png',fullPage:true});
            await ctx.close();
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            await shot(browser,'01-single-quiet-the-alarm',payload(['Quiet the Alarm'],{'Quiet the Alarm':4}),'quiet-the-alarm.html');
            await shot(browser,'02-two-stage',payload(['Quiet the Alarm','Break the Pull'],{'Quiet the Alarm':4,'Break the Pull':4}),'mixed-result.html');
            await shot(browser,'03-three-stage-self-guided',payload(['Quiet the Alarm','Break the Pull','Restore Self-Trust'],{'Quiet the Alarm':4,'Break the Pull':4,'Restore Self-Trust':4,'Return to Yourself':0}),'mixed-result.html');
            await shot(browser,'04-three-stage-readiness',payload(['Quiet the Alarm','Break the Pull','Restore Self-Trust'],{'Quiet the Alarm':5,'Break the Pull':5,'Restore Self-Trust':5,'Return to Yourself':0}),'mixed-result.html');
            await shot(browser,'05-four-stage-readiness',payload(order,{'Quiet the Alarm':4,'Break the Pull':4,'Restore Self-Trust':4,'Return to Yourself':4}),'mixed-result.html');
            await shot(browser,'06-bare-minimum',payload([],{'Quiet the Alarm':2,'Break the Pull':2,'Restore Self-Trust':2,'Return to Yourself':2}),'no-result.html');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node screenshots.js
      - uses: actions/upload-artifact@v4
        with:
          name: prelive-approved-result-screenshots
          path: prelive-screenshots/*.png
          if-no-files-found: error
