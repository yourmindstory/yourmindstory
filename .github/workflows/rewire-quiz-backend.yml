name: Wire Bootcamp result reveal UX

on:
  push:
    paths:
      - '.github/workflows/rewire-quiz-backend.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reveal script to result pages
        shell: bash
        run: |
          set -euo pipefail
          for f in quiet-the-alarm.html break-the-pull.html restore-self-trust.html return-to-yourself.html mixed-result.html no-result.html; do
            if grep -q 'assets/yms-results-copy-v2.js' "$f" && ! grep -q 'assets/yms-bootcamp-reveal.js' "$f"; then
              sed -i '/assets\/yms-results-copy-v2.js/a <script src="assets/yms-bootcamp-reveal.js?v=20260910-1"></script>' "$f"
            fi
          done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quiet-the-alarm.html break-the-pull.html restore-self-trust.html return-to-yourself.html mixed-result.html no-result.html
          git commit -m 'Wire progressive reveal UX into quiz result pages'
          git push
