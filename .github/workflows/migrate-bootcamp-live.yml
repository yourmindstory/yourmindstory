name: Wire live Bootcamp page across site

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-bootcamp-live.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point site and quiz to live Bootcamp page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Any existing internal link to the old waitlist now goes to the live sales page.
          for p in Path('.').rglob('*.html'):
              if p.name == 'bootcamp-waitlist.html':
                  continue
              s = p.read_text()
              ns = s.replace('bootcamp-waitlist.html', 'bootcamp.html')
              if ns != s:
                  p.write_text(ns)

          # Keep sitemap aligned too, even if already updated.
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              s = sitemap.read_text()
              ns = s.replace('bootcamp-waitlist.html', 'bootcamp.html')
              if ns != s:
                  sitemap.write_text(ns)

          # 2) The quiz Bootcamp recommendation should go to the sales page first,
          # not straight to Payhip.
          q = Path('assets/yms-results-copy-v2.js')
          if q.exists():
              s = q.read_text()
              old = '<div class="cta-row"><a class="btn-cta" href="https://payhip.com/b/ZhPkp" id="ymsFinalBootcampCta">JOIN THE ORIGINAL GROUP</a></div>'
              new = '<div class="cta-row"><a class="btn-cta" href="bootcamp.html" id="ymsFinalBootcampCta">SEE THE BOOTCAMP</a></div>'
              if old in s:
                  s = s.replace(old, new, 1)
              else:
                  # Safe fallback if wording has changed but the same final CTA remains.
                  s = s.replace('href="https://payhip.com/b/ZhPkp" id="ymsFinalBootcampCta"', 'href="bootcamp.html" id="ymsFinalBootcampCta"', 1)
                  s = s.replace('>JOIN THE ORIGINAL GROUP</a>', '>SEE THE BOOTCAMP</a>', 1)
              q.write_text(s)

          # Keep the live quiz UI test aligned with the new quiz -> sales page flow.
          t = Path('.github/workflows/test-live-quiz-ui.yml')
          if t.exists():
              s = t.read_text()
              s = s.replace("name: /JOIN THE ORIGINAL GROUP/i", "name: /SEE THE BOOTCAMP/i")
              s = s.replace("assert.strictEqual(await cta.getAttribute('href'), 'https://payhip.com/b/ZhPkp');", "assert.strictEqual(await cta.getAttribute('href'), 'bootcamp.html');")
              t.write_text(s)

          # 3) Preserve the old public URL and send people to the new one.
          # JavaScript preserves any UTM query string and hash; meta refresh is the no-JS fallback.
          redirect = '''<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Bootcamp | Your Mind Story</title>
          <meta name="robots" content="noindex, follow">
          <link rel="canonical" href="https://yourmindstory.co.uk/bootcamp.html">
          <meta http-equiv="refresh" content="0; url=bootcamp.html">
          <script>
          (function(){
            var target='bootcamp.html'+window.location.search+window.location.hash;
            window.location.replace(target);
          })();
          </script>
          </head>
          <body>
          <p>Taking you to the <a href="bootcamp.html">Your Mind Story Bootcamp</a>…</p>
          </body>
          </html>
          '''
          Path('bootcamp-waitlist.html').write_text(redirect)
          PY

          git diff --check

      - name: Verify live Bootcamp wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f bootcamp.html
          grep -q 'https://payhip.com/b/ZhPkp' bootcamp.html
          grep -q 'href="bootcamp.html" id="ymsFinalBootcampCta"' assets/yms-results-copy-v2.js
          grep -q 'window.location.replace' bootcamp-waitlist.html
          if grep -R --include='*.html' --exclude='bootcamp-waitlist.html' -n 'bootcamp-waitlist.html' .; then
            echo 'Old waitlist link still found in an HTML page.'
            exit 1
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Route site and quiz to live Bootcamp sales page'
          git push
