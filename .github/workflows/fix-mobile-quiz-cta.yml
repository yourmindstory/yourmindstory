name: Fix mobile quiz CTA visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-quiz-cta.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add visible mobile quiz CTAs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text()
          marker = '<div id="mobile">'
          if marker not in text:
              raise SystemExit('Mobile section not found')
          head, mobile = text.split(marker, 1)

          old_nav = '''  <div class="navbar" style="padding:14px 18px;">
    <div class="logo" style="font-size:12px;">YOUR MIND STORY</div>
    <div style="font-size:10px;">☰</div>
  </div>'''
          new_nav = '''  <div class="navbar" style="padding:14px 18px;">
    <div class="logo" style="font-size:12px;">YOUR MIND STORY</div>
    <a class="nav-quiz-cta" href="quiz.html" onclick="gtag('event','nav_click',{'link':'quiz'});gtag('event','nav_quiz_click');">Take the Quiz</a>
  </div>'''
          if old_nav in mobile:
              mobile = mobile.replace(old_nav, new_nav, 1)

          anchor = '''        <p class="body">We work on the checking, replaying, waiting and second-guessing that keep you caught in it, so you can feel steadier, trust yourself again and feel like yourself again.</p>'''
          hero_cta = anchor + '''
        <div style="margin-top:18px;">
          <div style="font-size:13px; color:#4a473c; margin-bottom:8px;">Not sure where to begin?</div>
          <a class="btn btn-quiz" href="quiz.html" onclick="gtag('event','cta_click',{'cta':'take_free_quiz_hero'});">Take the Free Quiz</a>
        </div>'''
          hero_before_image = mobile.split('<div class="hero-img-wrap">',1)[0]
          if 'take_free_quiz_hero' not in hero_before_image:
              if anchor not in mobile:
                  raise SystemExit('Mobile hero copy anchor not found')
              mobile = mobile.replace(anchor, hero_cta, 1)

          css = '''
  @media(max-width:820px){
    #mobile .hero .btn-quiz{background:var(--sage); color:var(--ink); border:1px solid var(--ink); padding:15px 18px; font-size:12px;}
    #mobile .nav-quiz-cta{font-size:10px; padding:9px 12px; white-space:nowrap;}
  }
'''
          if '#mobile .hero .btn-quiz{' not in head:
              head = head.replace('</style>', css + '\n</style>', 1)

          p.write_text(head + marker + mobile)
          PY
      - name: Commit mobile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Show quiz CTA prominently on mobile homepage"
          git push origin HEAD:main
