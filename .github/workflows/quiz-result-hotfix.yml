name: Quiz Result Hotfix
on:
  push:
    branches: [quiz-result-hotfix-2026-09-10]
    paths: ['.github/workflows/quiz-result-hotfix.yml']
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quiz-result-hotfix-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/quiz_results_hotfix.py
      - run: node --check assets/yms-quiz-shared.js
      - name: Commit hotfix
        run: |
          git config user.name "YMS Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add quiz.html quiz-landing-page.html quiet-the-alarm.html break-the-pull.html restore-self-trust.html return-to-yourself.html mixed-result.html no-result.html assets/yms-quiz-shared.js
          git commit -m "Hotfix quiz result cache and stale sessions"
          git push origin quiz-result-hotfix-2026-09-10
