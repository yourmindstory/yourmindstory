name: Test result-first flow 2026-09-19

on:
  push:
    branches:
      - fix-result-first-20260919
    paths:
      - 'assets/yms-bootcamp-reveal.js'
      - 'assets/yms-product-routing-v2.js'
      - 'mixed-result.html'
      - 'no-result.html'
      - 'low-result.html'
      - 'quiet-the-alarm.html'
      - 'break-the-pull.html'
      - 'restore-self-trust.html'
      - 'return-to-yourself.html'
      - '.github/workflows/test-result-first-20260919.yml'

jobs:
  result-first:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve branch
        run: |
          python3 -m http.server 4173 >/tmp/yms-http.log 2>&1 &
      - name: Verify result before recommendation for every route
        run: |
          cat > test-result-first.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          const BASE='http://127.0.0.1:4173';
          const order=['Quiet the Alarm','Break the Pull','Restore Self-Trust','Return to Yourself'];

          function data(stages, scores, extra={}) {
            const stageScores={};
            order.forEach(s=>stageScores[s]=scores[s] ?? (stages.includes(s)?3:0));
            const total=Object.values(stageScores).reduce((a,b)=>a+b,0);
            return Object.assign({
              firstName:'Test',
              resultType: stages.length===0?'no_clear_leader':(stages.length===1?'single':'mixed'),
              primaryResult: stages.length===1?stages[0]:null,
              leadingPatterns: stages.slice(0,2),
              secondaryActivePatterns: stages.slice(2),
              activeStages: stages.slice(),
              qualifyingStages: stages.slice(),
              stageScores,
              totalFourStageScore: total,
              breadthCount: stages.length,
              recommendationLevel: stages.length===0?'bare_minimum':(stages.length<=2?'audio_first':'complete_self_guided'),
              recommendationEngineVersion:'YMS-REC-2026-V2'
            },extra);
          }

          async function withResult(browser,payload,file,fn){
            const context=await browser.newContext();
            await context.addInitScript(p=>sessionStorage.setItem('yms_quiz_result',JSON.stringify(p)),payload);
            const page=await context.newPage();
            await page.goto(`${BASE}/${file}?qa=resultfirst`,{waitUntil:'networkidle'});
            await fn(page);
            await context.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});

            const singles=[
              ['Quiet the Alarm','quiet-the-alarm.html','I recommend Quiet the Alarm.'],
              ['Break the Pull','break-the-pull.html','I recommend Break the Pull.'],
              ['Restore Self-Trust','restore-self-trust.html','I recommend Restore Self-Trust.'],
              ['Return to Yourself','return-to-yourself.html','I recommend Return to Yourself.']
            ];
            for(const [stage,file,recommendation] of singles){
              await withResult(browser,data([stage],{[stage]:4}),file,async page=>{
                await page.getByText('YOUR RESULT',{exact:true}).waitFor({state:'visible'});
                await page.getByRole('heading',{name:stage,exact:true}).waitFor({state:'visible'});
                await page.getByText(/Based on your answers, this is where I think you’re getting hit hardest\./i).waitFor({state:'visible'});
                const show=page.getByRole('button',{name:/Show me my recommendation/i});
                await show.waitFor({state:'visible'});
                assert.strictEqual(await page.getByText(recommendation,{exact:true}).isVisible().catch(()=>false),false,'single recommendation visible too early: '+stage);
                await show.click();
                await page.getByText(recommendation,{exact:true}).waitFor({state:'visible'});
              });
              console.log('PASS single result-first',stage);
            }

            const pair=['Quiet the Alarm','Break the Pull'];
            await withResult(browser,data(pair,{'Quiet the Alarm':4,'Break the Pull':4}),'mixed-result.html',async page=>{
              await page.getByText('YOUR RESULT',{exact:true}).waitFor({state:'visible'});
              await page.getByRole('heading',{name:/two places that seem to be bothering you/i}).waitFor({state:'visible'});
              await page.getByText('Quiet the Alarm',{exact:true}).waitFor({state:'visible'});
              await page.getByText('Break the Pull',{exact:true}).waitFor({state:'visible'});
              const show=page.getByRole('button',{name:/Show me my recommendation/i});
              await show.waitFor({state:'visible'});
              assert.strictEqual(await page.getByRole('link',{name:/START MY TWO-STAGE PATHWAY/i}).isVisible().catch(()=>false),false);
              await show.click();
              await page.getByRole('link',{name:/START MY TWO-STAGE PATHWAY/i}).waitFor({state:'visible'});
            });
            console.log('PASS pair result-first');

            const threeLow=['Quiet the Alarm','Break the Pull','Restore Self-Trust'];
            await withResult(browser,data(threeLow,{'Quiet the Alarm':4,'Break the Pull':4,'Restore Self-Trust':4,'Return to Yourself':0}),'mixed-result.html',async page=>{
              await page.getByText('YOUR RESULT',{exact:true}).waitFor({state:'visible'});
              await page.getByRole('heading',{name:/affecting you in three places/i}).waitFor({state:'visible'});
              for(const s of threeLow) await page.getByText(s,{exact:true}).first().waitFor({state:'visible'});
              const show=page.getByRole('button',{name:/Show me my recommendation/i});
              await show.waitFor({state:'visible'});
              assert.strictEqual(await page.getByRole('link',{name:/START MY SELF-GUIDED JOURNEY/i}).isVisible().catch(()=>false),false);
              await show.click();
              await page.getByRole('link',{name:/START MY SELF-GUIDED JOURNEY/i}).waitFor({state:'visible'});
            });
            console.log('PASS three-stage result-first');

            const threeHigh=['Quiet the Alarm','Break the Pull','Restore Self-Trust'];
            await withResult(browser,data(threeHigh,{'Quiet the Alarm':5,'Break the Pull':5,'Restore Self-Trust':5,'Return to Yourself':0}),'mixed-result.html',async page=>{
              await page.getByText('YOUR RESULT',{exact:true}).waitFor({state:'visible'});
              await page.getByRole('heading',{name:/affecting you in three places/i}).waitFor({state:'visible'});
              const show=page.getByRole('button',{name:/Show me my recommendation/i});
              await show.waitFor({state:'visible'});
              assert.strictEqual(await page.getByText(/BEFORE WE LOOK AT YOUR RECOMMENDATION/i).isVisible().catch(()=>false),false);
              await show.click();
              await page.getByText(/BEFORE WE LOOK AT YOUR RECOMMENDATION/i).waitFor({state:'visible'});
              await page.getByLabel(/I want help understanding myself, breaking the cycle and getting my mind back/i).check();
              await page.getByLabel(/^Yes\.$/i).check();
              await page.getByRole('button',{name:/SHOW ME WHERE I’D START/i}).click();
              await page.getByRole('heading',{name:/I recommend the Original Group Bootcamp/i}).waitFor({state:'visible'});
            });
            console.log('PASS readiness result-first');

            const fourHigh=order.slice();
            await withResult(browser,data(fourHigh,{'Quiet the Alarm':4,'Break the Pull':4,'Restore Self-Trust':4,'Return to Yourself':4}),'mixed-result.html',async page=>{
              await page.getByText('YOUR RESULT',{exact:true}).waitFor({state:'visible'});
              await page.getByRole('heading',{name:/affecting you across the whole cycle/i}).waitFor({state:'visible'});
              const show=page.getByRole('button',{name:/Show me my recommendation/i});
              await show.waitFor({state:'visible'});
              assert.strictEqual(await page.getByText(/BEFORE WE LOOK AT YOUR RECOMMENDATION/i).isVisible().catch(()=>false),false);
            });
            console.log('PASS four-stage result-first');

            await withResult(browser,data([],{'Quiet the Alarm':2,'Break the Pull':2,'Restore Self-Trust':2,'Return to Yourself':2}),'no-result.html',async page=>{
              await page.getByText('YOUR RESULT',{exact:true}).waitFor({state:'visible'});
              await page.getByRole('heading',{name:/wouldn’t recommend one of the hypnotherapy audios right now/i}).waitFor({state:'visible'});
              const show=page.getByRole('button',{name:/Show me my recommendation/i});
              await show.waitFor({state:'visible'});
              assert.strictEqual(await page.getByRole('link',{name:/START WITH THE BARE MINIMUM/i}).isVisible().catch(()=>false),false);
              await show.click();
              await page.getByRole('link',{name:/START WITH THE BARE MINIMUM/i}).waitFor({state:'visible'});
            });
            console.log('PASS bare result-first');

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node test-result-first.js
