name: YMS Site Audit
on:
  push:
    branches: [website-audit-2026-09-10]
    paths:
      - '.github/workflows/site-audit.yml'
      - 'scripts/site_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-audit-2026-09-10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/site_audit.py
      - name: Commit audit reports
        run: |
          git config user.name "YMS Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add WEBSITE_AUDIT.md AUDIT_REPORT.json
          git commit -m "Generate website audit report" || exit 0
          git push origin website-audit-2026-09-10
