name: Mobile quiz CTA repair

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mobile-quiz-cta-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch homepage mobile CTA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<div id="mobile">'
          head,mobile=s.split(marker,1)
          old='''  <div class="navbar" style="padding:14px 18px;">\n    <div class="logo" style="font-size:12px;">YOUR MIND STORY</div>\n    <div style="font-size:10px;">☰</div>\n  </div>'''
          new='''  <div class="navbar" style="padding:14px 18px;">\n    <div class="logo" style="font-size:12px;">YOUR MIND STORY</div>\n    <a class="nav-quiz-cta" href="quiz.html" onclick="gtag('event','nav_click',{'link':'quiz'});gtag('event','nav_quiz_click');">Take the Quiz</a>\n  </div>'''
          mobile=mobile.replace(old,new,1)
          hero='''        <p class="body">We work on the checking, replaying, waiting and second-guessing that keep you caught in it, so you can feel steadier, trust yourself again and feel like yourself again.</p>'''
          before=mobile.split('<div class="hero-img-wrap">',1)[0]
          if 'take_free_quiz_hero' not in before:
              repl=hero+'''\n        <div style="margin-top:18px;">\n          <div style="font-size:13px; color:#4a473c; margin-bottom:8px;">Not sure where to begin?</div>\n          <a class="btn btn-quiz" href="quiz.html" onclick="gtag('event','cta_click',{'cta':'take_free_quiz_hero'});">Take the Free Quiz</a>\n        </div>'''
              if hero not in mobile:
                  raise SystemExit('mobile hero anchor missing')
              mobile=mobile.replace(hero,repl,1)
          css='''\n  @media(max-width:820px){\n    #mobile .hero .btn-quiz{background:var(--sage);color:var(--ink);border:1px solid var(--ink);padding:15px 18px;font-size:12px;}\n    #mobile .nav-quiz-cta{font-size:10px;padding:9px 12px;white-space:nowrap;}\n  }\n'''
          if '#mobile .hero .btn-quiz{' not in head:
              head=head.replace('</style>',css+'\n</style>',1)
          p.write_text(head+marker+mobile)
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show mobile quiz CTA clearly"
          git push
