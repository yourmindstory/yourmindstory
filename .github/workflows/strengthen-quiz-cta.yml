name: Strengthen website quiz CTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strengthen-quiz-cta.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make homepage quiz CTA prominent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()

          # Quiz in the navigation should read as an action rather than another tiny nav word.
          text=text.replace(
              '<a href="quiz.html" onclick="gtag(\'event\',\'nav_click\',{\'link\':\'quiz\'});">Quiz</a>',
              '<a class="nav-quiz-cta" href="quiz.html" onclick="gtag(\'event\',\'nav_click\',{\'link\':\'quiz\'});gtag(\'event\',\'nav_quiz_click\');">Take the Quiz</a>'
          )

          # The hero's quiz action was a small underlined text link. Keep the wording but make it a real button.
          text=text.replace(
              'class="btn-text" href="quiz.html" onclick="gtag(\'event\',\'cta_click\',{\'cta\':\'take_free_quiz_hero\'});">Take the Free Quiz →</a>',
              'class="btn btn-quiz" href="quiz.html" onclick="gtag(\'event\',\'cta_click\',{\'cta\':\'take_free_quiz_hero\'});">Take the Free Quiz</a>'
          )

          css='''\n  /* Quiz is a core funnel action, so it should not look like a low-priority text link. */\n  .nav-quiz-cta{display:inline-block;padding:9px 14px;background:var(--ink);color:var(--white)!important;text-decoration:none;border-radius:2px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}\n  @media(max-width:820px){\n    #mobile .navlinks{display:flex;}\n    #mobile .navlinks a:not(.nav-quiz-cta){display:none;}\n    #mobile .nav-quiz-cta{font-size:10px;padding:8px 11px;white-space:nowrap;}\n  }\n'''
          if '.nav-quiz-cta{' not in text:
              text=text.replace('</style>', css+'\n</style>', 1)

          p.write_text(text)
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Make homepage quiz CTA more prominent"
          git push origin HEAD:main
