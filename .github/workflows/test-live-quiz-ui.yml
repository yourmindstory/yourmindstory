name: Test live quiz result UI

on:
  push:
    paths:
      - '.github/workflows/test-live-quiz-ui.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test all live quiz result experiences
        run: |
          cat > test-ui.js <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            async function withResult(data, url, fn) {
              const context = await browser.newContext();
              await context.addInitScript((payload) => {
                sessionStorage.setItem('yms_quiz_result', JSON.stringify(payload));
              }, data);
              const page = await context.newPage();
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await fn(page);
              await context.close();
            }

            const bootcamp = {
              firstName: 'Test', resultType: 'mixed', primaryResult: null,
              tiedResults: ['Quiet the Alarm','Break the Pull','Restore Self Trust','Return to Yourself'],
              overallActivationStrength: 'strong', recommendationLevel: 'bootcamp_level',
              recommendedStage: '', recommendedProduct: 'Your Mind Story Bootcamp',
              totalFourStageScore: 24, breadthCount: 4
            };

            await withResult(bootcamp, 'https://yourmindstory.co.uk/mixed-result.html?qa=progressive-smoke2', async (page) => {
              const first = page.getByRole('button', { name: /Tell me what this means/i });
              await first.waitFor({ state: 'visible', timeout: 15000 });
              assert.strictEqual(await page.getByText('I recommend the Your Mind Story Bootcamp.').isVisible().catch(() => false), false);
              await first.click();
              const rec = page.getByRole('button', { name: /Show me my recommendation/i });
              await rec.waitFor({ state: 'visible' });
              await rec.click();
              await page.getByText('I recommend the Your Mind Story Bootcamp.').waitFor({ state: 'visible' });
              assert.strictEqual(await page.locator('.yms-mini-grid > div').count(), 4);
              const commitment = page.getByRole('button', { name: /What would I actually have to do/i });
              await commitment.click();
              await page.getByText('£297').waitFor({ state: 'visible' });
              const cta = page.getByRole('link', { name: /JOIN THE ORIGINAL GROUP/i });
              assert.strictEqual(await cta.getAttribute('href'), 'https://payhip.com/b/ZhPkp');
              console.log('PASS Bootcamp progressive reveal.');
            });

            const audioCases = [
              ['Quiet the Alarm','quiet-the-alarm.html','START WITH QUIET THE ALARM'],
              ['Break the Pull','break-the-pull.html','START WITH BREAK THE PULL'],
              ['Restore Self-Trust','restore-self-trust.html','START WITH RESTORE SELF-TRUST'],
              ['Return to Yourself','return-to-yourself.html','START WITH RETURN TO YOURSELF']
            ];

            for (const [stage,file,ctaText] of audioCases) {
              const audio = {firstName:'Test',resultType:'single',primaryResult:stage,tiedResults:[],overallActivationStrength:'strong',recommendationLevel:'audio_first',recommendedStage:stage,recommendedProduct:stage};
              await withResult(audio, `https://yourmindstory.co.uk/${file}?qa=audio-smoke2`, async (page) => {
                const first = page.getByRole('button', { name: /Show me my recommendation/i });
                await first.waitFor({ state: 'visible', timeout: 15000 });
                assert.strictEqual(await page.getByRole('link', { name: new RegExp(ctaText,'i') }).isVisible().catch(() => false), false);
                await first.click();
                const why = page.getByRole('button', { name: /Why this one/i });
                await why.waitFor({ state: 'visible' });
                await why.click();
                await page.getByRole('link', { name: new RegExp(ctaText,'i') }).waitFor({ state: 'visible' });
                console.log('PASS audio progressive reveal:', stage);
              });
            }

            const mixedAudio = {firstName:'Test',resultType:'mixed',primaryResult:null,tiedResults:['Quiet the Alarm','Break the Pull'],overallActivationStrength:'moderate',recommendationLevel:'audio_first',recommendedStage:'',recommendedProduct:'',mixedClarificationRequired:true};
            await withResult(mixedAudio, 'https://yourmindstory.co.uk/mixed-result.html?qa=mixed-smoke2', async (page) => {
              const btn = page.getByRole('button', { name: /Show me where to start/i });
              await btn.waitFor({ state: 'visible', timeout: 15000 });
              await btn.click();
              await page.getByText(/more than one part of the cycle|which one feels closest|where would you start/i).first().waitFor({ state: 'visible', timeout: 5000 });
              console.log('PASS mixed audio progressive reveal.');
            });

            const bare = {firstName:'Test',resultType:'none',primaryResult:null,tiedResults:[],recommendationLevel:'bare_minimum',recommendedProduct:'The Bare Minimum'};
            await withResult(bare, 'https://yourmindstory.co.uk/no-result.html?qa=bare-smoke2', async (page) => {
              const btn = page.getByRole('button', { name: /Show me my recommendation/i });
              await btn.waitFor({ state: 'visible', timeout: 15000 });
              assert.strictEqual(await page.getByRole('link', { name: /START WITH THE BARE MINIMUM/i }).isVisible().catch(() => false), false);
              await btn.click();
              const cta = page.getByRole('link', { name: /START WITH THE BARE MINIMUM/i });
              await cta.waitFor({ state: 'visible' });
              assert.strictEqual(await cta.getAttribute('href'), 'https://payhip.com/b/ZcdmX');
              console.log('PASS Bare Minimum progressive reveal.');
            });

            for (const file of ['quiet-the-alarm.html','break-the-pull.html','restore-self-trust.html','return-to-yourself.html','mixed-result.html','no-result.html']) {
              const html = await (await fetch('https://yourmindstory.co.uk/' + file + '?qa=script-check2')).text();
              assert(html.includes('assets/yms-bootcamp-reveal.js?v=20260910-2'), file + ' missing latest reveal script');
            }
            console.log('PASS wiring on all six result pages.');

            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node test-ui.js
