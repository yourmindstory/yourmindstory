<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help me make this actually work for you - Your Mind Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

<style>
:root{--bg:#F2EFE8;--fg:#1A0A2E;--rule:rgba(26,10,46,0.08);--muted:#1A0A2E;--dim:rgba(26,10,46,0.50);--accent:#8A5A6B;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}
.page{display:flex;flex-direction:column;align-items:center;padding:0 24px 100px;}
@media(min-width:768px){.page{padding:0 24px 100px;}}
.inner{width:100%;max-width:580px;}
@keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.screen{display:none;}
.screen.active{display:block;animation:up 0.5s ease forwards;}
hr.rule{width:100%;border:none;border-top:1px solid var(--rule);margin:36px 0;}
.hdr{padding-top:48px;padding-bottom:28px;text-align:center;border-bottom:1px solid var(--rule);margin-bottom:40px;}
.hdr.compact{padding-top:28px;padding-bottom:18px;margin-bottom:28px;}
.wm{font-family:'Gilda Display',serif;font-size:clamp(13px,3vw,16px);letter-spacing:0.24em;text-transform:uppercase;color:var(--dim);display:block;text-align:center;}

/* PROGRESS */
.progress{margin-bottom:36px;}
.progress-label{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
.progress-bg{width:100%;height:1px;background:var(--rule);}
.progress-fill{height:1px;background:var(--fg);transition:width 0.4s ease,background 0.4s ease;}
.progress-fill.stage2{background:var(--accent);}

.btn-back{display:none;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.08em;color:var(--dim);background:none;border:none;cursor:pointer;padding:8px 0;text-transform:uppercase;margin-bottom:8px;}
.btn-back::before{content:'\2190 ';}

.eyebrow{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.10em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;}
.q-name{display:block;font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(13px,3vw,15px);color:var(--dim);margin-bottom:10px;}
.q-text{display:block;font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(21px,5.2vw,28px);line-height:1.25;color:var(--fg);margin-bottom:26px;}
.q-sub{display:block;font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(13px,3vw,14px);line-height:1.7;color:var(--dim);margin-top:-14px;margin-bottom:22px;}
.encourage{display:block;font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(14px,3.4vw,16px);color:var(--accent);margin-bottom:20px;}

.intro-head{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(24px,6vw,34px);line-height:1.15;color:var(--fg);display:block;margin-bottom:22px;}
.intro-body{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.6vw,17px);line-height:1.85;color:var(--muted);display:block;}
.intro-body+.intro-body{margin-top:14px;}

.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
.opt{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border:1px solid var(--rule);cursor:pointer;transition:border-color 0.2s,background 0.2s;}
.opt:hover{border-color:rgba(26,10,46,0.25);}
.opt.selected{border-color:var(--fg);background:rgba(26,10,46,0.04);}
.opt input{display:none;}
.dot{width:14px;height:14px;min-width:14px;border:1px solid rgba(26,10,46,0.28);border-radius:50%;margin-top:3px;transition:border-color 0.2s,background 0.2s;}
.opt.selected .dot{background:var(--fg);border-color:var(--fg);}
.opt.cb .dot{border-radius:2px;}
.opt-text{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(14px,3.2vw,15px);line-height:1.6;color:rgba(26,10,46,0.75);}
.opt.selected .opt-text{color:var(--fg);}

textarea.q-input, input.q-input{width:100%;background:rgba(26,10,46,0.02);border:1px solid var(--rule);border-bottom:1px solid rgba(26,10,46,0.22);color:var(--fg);font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.5vw,16px);line-height:1.7;padding:16px 18px;outline:none;resize:none;transition:border-color 0.2s;margin-bottom:8px;}
textarea.q-input{min-height:110px;}
textarea.q-input:focus, input.q-input:focus{border-color:rgba(26,10,46,0.4);}
textarea.q-input::placeholder, input.q-input::placeholder{color:rgba(26,10,46,0.28);font-style:italic;}

.scale-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.scale-btn{width:44px;height:44px;border:1px solid var(--rule);background:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--fg);cursor:pointer;transition:border-color 0.2s,background 0.2s;}
.scale-btn.selected{border-color:var(--fg);background:var(--fg);color:var(--bg);}
.scale-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:24px;}

.btn-row{margin-top:30px;display:flex;flex-direction:column;gap:14px;}
.btn-primary{display:block;width:100%;font-family:'DM Sans',sans-serif;font-weight:400;font-size:clamp(11px,2.6vw,13px);letter-spacing:0.15em;text-transform:uppercase;color:var(--bg);background:var(--fg);border:none;padding:20px 32px;cursor:pointer;text-decoration:none;text-align:center;transition:opacity 0.2s;}
.btn-primary:hover{opacity:0.82;}
.btn-primary:disabled{opacity:0.32;cursor:not-allowed;}
.btn-skip{background:none;border:none;font-family:'DM Sans',sans-serif;font-weight:300;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);cursor:pointer;padding:6px 0;}
.btn-skip:hover{color:var(--fg);}

.close-wrap{text-align:center;padding:40px 0;}
.close-head{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(24px,6vw,32px);color:var(--fg);display:block;margin-bottom:18px;line-height:1.3;}
.close-body{font-family:'DM Sans',sans-serif;font-weight:300;font-size:clamp(15px,3.5vw,16px);line-height:1.85;color:var(--muted);display:block;margin-bottom:34px;}
.signature{font-family:'Gilda Display',serif;font-style:italic;font-size:clamp(14px,3.2vw,15px);color:var(--dim);display:block;margin-top:28px;}

footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:10px;}
.footer-links{display:flex;gap:28px;}
.footer-links a{font-family:'DM Sans',sans-serif;font-weight:300;font-size:10px;letter-spacing:0.10em;text-transform:uppercase;color:rgba(26,10,46,0.55);text-decoration:none;}
:focus-visible{outline:1px solid rgba(26,10,46,0.4);outline-offset:4px;}
</style>
</head>
<body>
<main class="page" role="main">
<div class="inner">

<header class="hdr" id="hdr">
<span class="wm">Your Mind Story</span>
</header>

<div class="progress" id="progress" style="display:none;">
<span class="progress-label" id="prog-label">Section 1 of 2</span>
<div class="progress-bg"><div class="progress-fill" id="prog-fill" style="width:2%"></div></div>
</div>

<button type="button" class="btn-back" id="back-btn" onclick="goBack()">Back</button>

<div id="app"></div>

</div>
</main>

<script>
/* ============ CONFIG ============ */
var VARIANT = 'bought';
var SHEET = 'https://script.google.com/macros/s/AKfycbxMP4TxB9UsY1i8WuNsZjgj-BmMo0o6dAKu3OAKCDl1CrfDm7218CH5UvNXoWyjfViK/exec';
var BOOK_URL = 'https://payhip.com/b/ZcdmX';

/* ============ METADATA (pulled automatically, never asked) ============ */
function getMeta() {
  var qs = new URLSearchParams(location.search);
  var traffic = qs.get('utm_source') || qs.get('src') || '';
  if (!traffic && document.referrer) {
    try { traffic = new URL(document.referrer).hostname; } catch(e) {}
  }
  var yms = {};
  try { yms = JSON.parse(sessionStorage.getItem('yms_result') || '{}'); } catch(e) {}
  return {
    traffic_source: traffic || '',
    quiz_bucket: yms.bucket || qs.get('bucket') || '',
    reached_results: yms.bucket ? 'yes' : (qs.get('bucket') ? 'yes' : 'yes'),
    product_clicked: qs.get('product') || '',
    cart_status: qs.get('cart') || 'purchased',
    purchase_status: 'yes'
  };
}

/* ============ STEPS ============ */
/* Bought variant: Q4 is already known ("Yes, and I bought") so it is never
   shown as a question — we jump straight to the Stage 1B follow-up. The
   objection-focused questions (5, 6, 7, 7b, 10) don't apply to a buyer, so
   they're dropped. Stage 2 stays the same set of optional questions. */
var STEPS = [
  {id:'intro', type:'intro', stage:1},
  {id:'q1', type:'options', stage:1, q:'How did you find me?', key:'q1_how_found',
    options:['TikTok','Instagram','Facebook','Google','A friend','Other']},
  {id:'q2', type:'text', stage:1, q:'What were you hoping Your Mind Story could help you achieve?', key:'q2_hoped_outcome',
    placeholder:'I was hoping it could help me...'},
  {id:'q3', type:'text', stage:1, q:'Imagine you’re telling a friend about Your Mind Story. What would you say it does?', key:'q3_friend_explain',
    placeholder:'I’d tell her it’s...', encourage:'That’s really helpful.'},
  {id:'q3b', type:'options', stage:1, q:'How confident are you that you understand what Your Mind Story offers?', key:'q3b_confidence',
    options:['Very confident','Fairly confident','Not very confident','Not at all confident']},
  {id:'s1b', type:'text', stage:1, q:'What made you decide to go ahead?', key:'stage1b_answer',
    placeholder:'What made it click was...'},
  {id:'q8', type:'text', stage:1, q:'If you could change one thing about Your Mind Story, what would it be?', key:'q8_change_one_thing',
    placeholder:'I’d change...', encourage:'You’re about halfway there.'},
  {id:'q9', type:'options', stage:1, q:'At today’s price, how did the product feel to you?', key:'q9_price_value',
    options:['Excellent value','Good value','About right','Slightly expensive','Too expensive']},
  {id:'q11', type:'text', stage:1, q:'Is there anything I should have asked that I didn’t?', key:'q11_anything_else',
    placeholder:'You could have asked me...'},

  {id:'s2intro', type:'stage2intro', stage:1},

  {id:'s2_1', type:'text', stage:2, q:'What almost stopped you from buying?', key:'s2_outcome_blocker',
    placeholder:'The thing that almost stopped me was...'},
  {id:'s2_2', type:'options', stage:2, multi:true, q:'Which of these would have made you feel even more confident before buying?', key:'s2_confidence_helpers',
    options:['More customer stories','More before-and-after experiences','More information about how the audios work','More information about me','Scientific evidence','A money-back guarantee','More sample audio','Something else']},
  {id:'s2_3', type:'text', stage:2, q:'Was there anything you expected to see that wasn’t there?', key:'s2_expected_missing',
    placeholder:'No, or... yes, I expected to see'},
  {id:'s2_4', type:'scale', stage:2, q:'Did the quiz describe you accurately?', key:'s2_quiz_accuracy_score', scaleMax:10},
  {id:'s2_5', type:'text', stage:2, q:'What part felt most accurate?', key:'s2_accurate_part',
    placeholder:'The part about...'},
  {id:'s2_6', type:'text', stage:2, q:'What part felt inaccurate, if anything?', key:'s2_inaccurate_part',
    placeholder:'None, or... the part about'},
  {id:'s2_7', type:'options', stage:2, q:'What, if anything, felt unclear?', key:'s2_unclear',
    options:['No, it was all clear','Yes, something felt unclear']},
  {id:'s2_7b', type:'options', stage:2, q:'Where did it feel unclear?', key:'s2_unclear_where',
    options:['Homepage','Quiz','Results page','Product pages','Checkout','Emails']},
  {id:'s2_8', type:'text', stage:2, q:'What would make the experience even better?', key:'s2_comeback_reason',
    placeholder:'It would be even better if...', encourage:'Nearly done. Thank you for this.'},
  {id:'s2_9', type:'text', stage:2, q:'If you were in charge of Your Mind Story for one day, what’s the first thing you’d change?', key:'s2_one_day_change',
    placeholder:'The first thing I’d change is...'},
  {id:'s2_10', type:'text', stage:2, q:'If I could wave a magic wand and improve one thing about your experience, what would it be?', key:'s2_magic_wand',
    placeholder:'It would be...'},

  {id:'close', type:'close', stage:2}
];

/* ============ ENGINE ============ */
var answers = {q4_considered_buying: 'Yes, and I bought'};
var order = [];
var histIdx = [];
var cur = 0;
var totalStage1 = STEPS.filter(function(s){return s.stage===1 && s.type!=='intro' && s.type!=='stage2intro';}).length;

function meta() { return getMeta(); }

function buildInitialOrder() {
  order = [];
  for (var i=0;i<STEPS.length;i++) {
    if (STEPS[i].id === 's2_7b') continue;
    order.push(STEPS[i].id);
  }
}
buildInitialOrder();

function stepById(id) { for (var i=0;i<STEPS.length;i++) if (STEPS[i].id===id) return STEPS[i]; return null; }

function render() {
  var id = order[cur];
  var step = stepById(id);
  var app = document.getElementById('app');
  var html = '';

  if (step.type === 'intro') {
    html += '<div class="intro-head">Help me make this actually work for you.</div>';
    html += '<div class="intro-body">I’m trying to understand exactly what worked, so I can make Your Mind Story even better for the next woman. This takes about 2 minutes. If you want to tell me more after that, there’s an optional second part.</div>';
    html += '<div class="intro-body">As a thank you, I’ll send you The Bare Minimum, my book on the five things your nervous system actually needs to stay well in love, free.</div>';
    html += '<div class="btn-row"><button type="button" class="btn-primary" onclick="gtag(\'event\',\'interview_start\',{variant:VARIANT});go(1)">Begin</button></div>';
  }
  else if (step.type === 'stage2intro') {
    html += '<div class="intro-head">Thank you. That’s genuinely helpful already.</div>';
    html += '<div class="intro-body">If you’ve got a few more minutes, the questions below help me even more. Completely optional — you can also send everything now.</div>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn-primary" onclick="go(cur+1)">Keep going</button>';
    html += '<button type="button" class="btn-skip" onclick="go(order.indexOf(\'close\'))">Send what I’ve got</button>';
    html += '</div>';
  }
  else if (step.type === 'options') {
    html += '<span class="eyebrow">' + (step.stage===2?'Optional':'A question') + '</span>';
    if (step.encourage) html += '<span class="encourage">' + step.encourage + '</span>';
    html += '<span class="q-text">' + step.q + '</span>';
    html += '<div class="opts" id="opts-' + step.id + '">';
    step.options.forEach(function(o) {
      var cls = step.multi ? 'opt cb' : 'opt';
      html += '<label class="' + cls + '" onclick="pick(this,\'' + step.id + '\',\'' + esc(o) + '\',' + !!step.multi + ')"><input type="' + (step.multi?'checkbox':'radio') + '" onclick="event.stopPropagation()"><span class="dot"></span><span class="opt-text">' + o + '</span></label>';
    });
    html += '</div>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn-primary" id="next-btn" onclick="advance()" disabled>Next</button>';
    if (step.stage===2) html += '<button type="button" class="btn-skip" onclick="skip()">Skip this one</button>';
    html += '</div>';
  }
  else if (step.type === 'text') {
    html += '<span class="eyebrow">' + (step.stage===2?'Optional':'A question') + '</span>';
    if (step.encourage) html += '<span class="encourage">' + step.encourage + '</span>';
    html += '<span class="q-text">' + step.q + '</span>';
    html += '<textarea class="q-input" id="in-' + step.id + '" rows="4" placeholder="' + (step.placeholder||'') + '" oninput="onTextInput(\'' + step.id + '\')"></textarea>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn-primary" id="next-btn" onclick="advance()" ' + (step.stage===1?'disabled':'') + '>Next</button>';
    if (step.stage===2) html += '<button type="button" class="btn-skip" onclick="skip()">Skip this one</button>';
    html += '</div>';
  }
  else if (step.type === 'scale') {
    html += '<span class="eyebrow">Optional</span>';
    html += '<span class="q-text">' + step.q + '</span>';
    html += '<div class="scale-row" id="scale-' + step.id + '">';
    for (var n=1;n<=step.scaleMax;n++) html += '<button type="button" class="scale-btn" onclick="pickScale(this,\'' + step.id + '\',' + n + ')">' + n + '</button>';
    html += '</div>';
    html += '<div class="scale-labels"><span>Not at all</span><span>Exactly me</span></div>';
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn-primary" id="next-btn" onclick="advance()" disabled>Next</button>';
    html += '<button type="button" class="btn-skip" onclick="skip()">Skip this one</button>';
    html += '</div>';
  }
  else if (step.type === 'close') {
    html += '<div class="close-wrap">';
    html += '<span class="close-head">Thank you. You’ve genuinely helped me improve something for the next woman.</span>';
    html += '<span class="close-body">As promised, here’s your copy of The Bare Minimum — the five things your nervous system actually needs to stay well in love.</span>';
    html += '<a class="btn-primary" style="display:inline-block;" href="' + BOOK_URL + '" target="_blank" rel="noopener" onclick="gtag(\'event\',\'book_claim_click\',{variant:VARIANT})">Get The Bare Minimum, free</a>';
    html += '<span class="signature">Onye</span>';
    html += '</div>';
  }

  app.innerHTML = html;

  if (step.type === 'options') restoreOptions(step);
  if (step.type === 'text') restoreText(step);
  if (step.type === 'scale') restoreScale(step);

  updateChrome();
}

function esc(s) { return String(s).replace(/'/g, '\\\''); }

function restoreOptions(step) {
  var val = answers[step.key];
  if (!val) return;
  var vals = step.multi ? val.split(', ') : [val];
  document.querySelectorAll('#opts-' + step.id + ' .opt').forEach(function(l) {
    var text = l.querySelector('.opt-text').textContent;
    if (vals.indexOf(text) !== -1) l.classList.add('selected');
  });
  var btn = document.getElementById('next-btn');
  if (btn) btn.disabled = false;
}
function restoreText(step) {
  var val = answers[step.key];
  var el = document.getElementById('in-' + step.id);
  if (el && val) el.value = val;
  if (step.stage === 1) {
    var btn = document.getElementById('next-btn');
    if (btn) btn.disabled = !(val && val.trim().length > 0);
  }
}
function restoreScale(step) {
  var val = answers[step.key];
  if (!val) return;
  document.querySelectorAll('#scale-' + step.id + ' .scale-btn').forEach(function(b) {
    if (b.textContent === val) b.classList.add('selected');
  });
  var btn = document.getElementById('next-btn');
  if (btn) btn.disabled = false;
}

function onTextInput(id) {
  var step = stepById(id);
  var val = document.getElementById('in-' + id).value;
  answers[step.key] = val;
  if (step.stage === 1) {
    var btn = document.getElementById('next-btn');
    if (btn) btn.disabled = val.trim().length === 0;
  }
}

function pick(el, id, value, multi) {
  var step = stepById(id);
  if (!multi) {
    document.querySelectorAll('#opts-' + id + ' .opt').forEach(function(l){ l.classList.remove('selected'); });
    el.classList.add('selected');
    answers[step.key] = value;
  } else {
    el.classList.toggle('selected');
    var chosen = [];
    document.querySelectorAll('#opts-' + id + ' .opt.selected .opt-text').forEach(function(t){ chosen.push(t.textContent); });
    answers[step.key] = chosen.join(', ');
  }
  var btn = document.getElementById('next-btn');
  if (btn) btn.disabled = (answers[step.key] || '').length === 0;
}

function pickScale(el, id, n) {
  var step = stepById(id);
  document.querySelectorAll('#scale-' + id + ' .scale-btn').forEach(function(b){ b.classList.remove('selected'); });
  el.classList.add('selected');
  answers[step.key] = String(n);
  document.getElementById('next-btn').disabled = false;
}

function insertBranchFollowup() {
  var idx = order.indexOf('s2_7');
  var already = order.indexOf('s2_7b') !== -1;
  if (answers['s2_unclear'] === 'Yes, something felt unclear' && !already) {
    order.splice(idx+1, 0, 's2_7b');
  } else if (already && answers['s2_unclear'] !== 'Yes, something felt unclear') {
    order.splice(order.indexOf('s2_7b'), 1);
  }
}

function advance() {
  var id = order[cur];
  if (id === 's2_7') insertBranchFollowup();
  go(cur+1);
}
function skip() { go(cur+1); }

function go(n) {
  if (n >= order.length) n = order.length - 1;
  histIdx.push(cur);
  cur = n;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  if (order[cur] === 'close') finish();
}

function goBack() {
  if (histIdx.length === 0) return;
  cur = histIdx.pop();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateChrome() {
  var id = order[cur];
  var step = stepById(id);
  var hdr = document.getElementById('hdr');
  var prog = document.getElementById('progress');
  var back = document.getElementById('back-btn');

  if (step.type === 'intro') {
    hdr.classList.remove('compact');
    prog.style.display = 'none';
    back.style.display = 'none';
    return;
  }
  hdr.classList.add('compact');
  back.style.display = (histIdx.length > 0 && step.type !== 'close') ? 'block' : 'none';

  if (step.type === 'close') { prog.style.display = 'none'; return; }

  prog.style.display = 'block';
  var fill = document.getElementById('prog-fill');
  var label = document.getElementById('prog-label');

  if (step.stage === 1) {
    var doneCount = 0;
    for (var i=0;i<=cur;i++) { var s = stepById(order[i]); if (s.stage===1 && s.type!=='intro' && s.type!=='stage2intro') doneCount++; }
    var pct = Math.round((doneCount/totalStage1)*100);
    fill.style.width = pct + '%';
    fill.classList.remove('stage2');
    label.textContent = 'Section 1 of 2';
  } else {
    var s2steps = STEPS.filter(function(s){return s.stage===2 && s.type!=='close';});
    var doneS2 = 0;
    for (var j=0;j<=cur;j++) { var st = stepById(order[j]); if (st.stage===2 && st.type!=='close') doneS2++; }
    var pct2 = Math.round((doneS2/s2steps.length)*100);
    fill.style.width = pct2 + '%';
    fill.classList.add('stage2');
    label.textContent = 'Optional — a few more, if you have a moment';
  }
}

var submitted = false;
function finish() {
  if (submitted) return;
  submitted = true;
  var m = meta();
  var payload = Object.assign({variant: VARIANT}, m, answers);
  try {
    if (navigator.sendBeacon) {
      var blob = new Blob([JSON.stringify(payload)], {type:'text/plain;charset=UTF-8'});
      navigator.sendBeacon(SHEET, blob);
    } else {
      fetch(SHEET, {method:'POST', mode:'no-cors', keepalive:true, body: JSON.stringify(payload)});
    }
  } catch(e) {}
  gtag('event','interview_complete',{variant:VARIANT});
}

render();
