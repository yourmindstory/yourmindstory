<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Assessment | Your Mind Story</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet"><style>
:root{--ink:#111827;--sage:#dce4d8;--sage2:#879782;--brass:#9b7a45;--line:#e7e8e6;--muted:#62666d;--purple:#eee9f4}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"DM Sans",sans-serif;background:#fff}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.logo{font-size:12px;font-weight:600;letter-spacing:.13em}.count{font-size:12px;color:var(--muted)}.bar{height:2px;background:#f0f0ed}.fill{height:100%;background:var(--brass);width:0;transition:width .25s}.main{max-width:720px;margin:0 auto;padding:64px 24px 100px}.step{display:none}.step.active{display:block}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--brass);font-weight:600}.q{font-family:Fraunces,serif;font-size:clamp(32px,5vw,45px);line-height:1.08;letter-spacing:-.025em;margin:16px 0 34px}.sub{font-size:15px;color:var(--muted);line-height:1.6;margin-top:-20px;margin-bottom:30px}.options{display:grid;gap:11px}.opt{border:1px solid var(--line);padding:18px 19px;background:white;text-align:left;font:inherit;color:var(--ink);cursor:pointer;line-height:1.45;transition:.15s}.opt:hover,.opt.sel{border-color:var(--sage2);background:#f6f8f5}.opt.sel{box-shadow:inset 3px 0 0 var(--sage2)}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:30px}.back{border:0;background:none;color:var(--muted);padding:12px 0;cursor:pointer}.next{border:0;background:var(--ink);color:white;padding:15px 21px;font-weight:600;cursor:pointer}.next:disabled{opacity:.3}.field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid var(--line);padding:16px;font:inherit}.field textarea{min-height:130px;resize:vertical}.checks label{display:flex;gap:11px;font-size:13px;line-height:1.5;margin-top:14px}.result{max-width:820px}.result h1{font-family:Fraunces,serif;font-size:48px;line-height:1.02;margin:14px 0 18px}.result .lead{font-size:18px;line-height:1.65}.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:32px 0}.score{padding:18px 12px;background:#f6f8f5;border-top:2px solid var(--sage2)}.score strong{display:block;font-family:Fraunces,serif;font-size:28px}.score span{font-size:11px}.bridge{border-top:1px solid var(--line);padding-top:28px;margin-top:30px}.bridge h2{font-family:Fraunces,serif;font-size:31px}.rec{margin-top:30px;padding:25px;background:var(--ink);color:white}.rec small{color:#cfd3db}.rec h2{font-family:Fraunces,serif;font-size:31px;margin:8px 0}.rec p{line-height:1.6}.note{font-size:12px;color:var(--muted);margin-top:28px}@media(max-width:600px){.main{padding-top:42px}.q{font-size:34px}.scoregrid{grid-template-columns:1fr 1fr}.result h1{font-size:39px}}</style></head><body>
<header class="top"><div class="logo">YOUR MIND STORY</div><div class="count" id="count">01 / 15</div></header><div class="bar"><div class="fill" id="fill"></div></div><main class="main"><form id="form"></form><section id="result" class="step result"></section></main>
<script>
const STAGES=['Quiet the Alarm','Break the Pull','Restore Self-Trust','Return to Yourself'];
const Q=[
{p:"When something about him or the situation triggers you, what usually happens inside you?",o:["I notice it, but I can stay relatively settled.","I feel unsettled for a while, but I can usually calm myself.","I feel a strong emotional or physical reaction that is difficult to settle.","My whole system seems to go into alarm. I can feel anxious, agitated, sick, panicky or unable to think about much else."]},
{p:"Once something about him or the situation has triggered you, how long does it usually take before you feel properly settled again?",o:["I can usually settle fairly quickly and carry on with my day.","It takes some effort, but I usually come back down.","It can take hours before I feel properly settled again.","It can affect me for most of the day or longer, even when nothing else has happened."]},
{p:"When thoughts or feelings about him pull you in, what are you most likely to do?",o:["I can usually notice the pull without needing to do anything about it.","I think about it, but I can usually resist doing something just to make the feeling or uncertainty go away.","I often check my phone, old messages, social media or look for something that might give me reassurance or answers.","I can get caught in repeated checking, messaging, searching or looking for reassurance, even when I know it isn't helping."]},
{p:"How much of your attention is currently taken up by thinking about him, replaying what happened or trying to make sense of the situation?",o:["Very little. I can think about it without getting pulled into it.","It comes up, but it doesn't take over my attention.","I find myself returning to it repeatedly throughout the day.","I can spend a significant amount of time replaying conversations, analysing, imagining possibilities or trying to work out what things mean."]},
{p:"When you think about what happened or what is happening with him, how much do you trust your own judgement about it?",o:["I generally trust what I see, feel and know.","I sometimes second-guess myself, but I usually come back to my own judgement.","I frequently wonder whether I'm overreacting, misunderstanding things or expecting too much.","I question myself so much that I can end up unsure what to trust anymore."]},
{p:"When you make a decision about what you need, what you will accept or what you will no longer do, how easy is it to stand by it?",o:["I can usually stand by my decisions.","I sometimes wobble, but I generally come back to what I decided.","I often reconsider when I miss him, think about him, hear from him or start hoping things might change.","I repeatedly find myself going back on decisions or boundaries that I genuinely meant to keep."]},
{p:"Compared with who you were before this situation began affecting you, how much do you feel like yourself now?",o:["I still feel like myself.","I've been knocked off-centre, but I still recognise myself.","I've lost touch with parts of myself and the life I used to have.","I barely recognise myself anymore."]},
{p:"How much is this situation affecting the rest of your life?",o:["Very little. My life still feels like mine.","Some things have slipped, but I'm still mostly living my own life.","It's noticeably affecting things like my mood, concentration, sleep, routines, relationships or plans.","A significant part of my emotional life or day now seems to revolve around him or what has happened."]},
{p:"Which of these feels closest to where you are right now?",o:["I still feel like I need to understand why he behaves this way before I can move forward.","I've learned a lot about him and the pattern, but I still feel like there must be something I'm missing.","I understand quite a lot about what is happening, but knowing that hasn't stopped how strongly it affects me.","I'm less interested in understanding him now. I want to change what this situation is doing to me."]},
{p:"When you notice yourself getting pulled into the same cycle again, what usually happens?",o:["I can usually recognise it and choose not to follow it.","I can sometimes interrupt it, although it still takes effort.","I know what's happening, but I still find myself getting pulled back into it.","I can see the pattern clearly and still feel unable to stop repeating it."]},
{p:"Which best describes where things are with him right now?",o:["We're together or still actively involved.","Contact or the relationship is inconsistent, unclear or on-and-off.","It has ended, but we're still in contact or keep reconnecting.","It has ended and there is little or no contact, but I still feel emotionally caught in it.","None of these quite describes my situation."]},
{p:"If this situation stopped having such a hold over you, which change would matter most to you right now?",o:["I want my peace back.","I want to trust myself and my decisions again.","I want freedom from constantly thinking, checking, waiting or replaying.","I want to feel like myself again and be able to move forward, whether he's in my life or not.","Something else."]},
{p:"What have you already tried to help yourself feel better or get out of this cycle?",multi:true,o:["Reading or watching content about avoidant attachment or relationships","Talking it through with friends or family","Therapy or counselling","Journalling, self-help or personal development","Blocking him, going no contact or trying to distance myself","Trying to date or move on","Trying to reason or talk myself out of how I feel","Trying to manage it by myself","I haven't really tried anything yet","Something else"]},
{p:"Which best describes how ready you feel to work on the part of this pattern that is happening in you?",o:["Right now, I'm mainly looking to understand what is happening.","I know something needs to change, but I'm not sure I'm ready to actively work on it yet.","I know understanding alone isn't enough and I'm ready to start working on this.","I'm ready for a structured process and willing to participate in it consistently."]},
{p:"Is there anything else you'd like me to know about what you're going through or what you'd like help changing?",text:true,sub:"Optional. Write as much or as little as you like."}
];
let a=Array(15).fill(null),i=0;
function track(n,p={}){try{if(window.gtag)gtag('event',n,Object.assign({assessment_version:'YMS-ASSESSMENT-2026-V3'},p))}catch(e){}}
function render(){document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / 15';document.getElementById('fill').style.width=((i)/15*100)+'%';const q=Q[i];let body='<section class="step active"><div class="eyebrow">Question '+(i+1)+' of 15</div><div class="q">'+q.p+'</div>'+(q.sub?'<div class="sub">'+q.sub+'</div>':'');
if(q.text){body+='<div class="field"><textarea id="txt" maxlength="1500">'+(a[i]||'')+'</textarea></div>'}else{body+='<div class="options">'+q.o.map((x,j)=>'<button type="button" class="opt '+((q.multi&&Array.isArray(a[i])&&a[i].includes(j))||a[i]===j?'sel':'')+'" data-v="'+j+'">'+x+'</button>').join('')+'</div>'}
body+='<div class="actions"><button type="button" class="back" id="back">'+(i?'Back':'')+'</button>'+(q.multi||q.text?'<button type="button" class="next" id="next">'+(i===14?'SEE MY RESULT':'Continue')+'</button>':'')+'</div></section>';document.getElementById('form').innerHTML=body;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let v=+b.dataset.v;if(q.multi){let ar=Array.isArray(a[i])?[...a[i]]:[];ar.includes(v)?ar=ar.filter(x=>x!==v):ar.push(v);a[i]=ar;render();return;}a[i]=v;track('assessment_question_complete',{question_number:i+1});if(i<14){i++;render();}else{render();}});
document.getElementById('back').onclick=()=>{if(i){i--;render()}};const nb=document.getElementById('next');if(nb)nb.onclick=()=>{if(q.text)a[i]=document.getElementById('txt').value.trim();if(!q.text&&(a[i]===null||(q.multi&&a[i].length===0)))return;if(i<14){track('assessment_question_complete',{question_number:i+1});i++;render()}else showResult()}}
function showResult(){
document.getElementById('form').style.display='none';document.getElementById('count').textContent='YOUR RESULT';document.getElementById('fill').style.width='100%';
let s=[a[0]+a[1],a[2]+a[3],a[4]+a[5],a[6]+a[7]],total=s.reduce((x,y)=>x+y,0),qual=s.map((x,j)=>x>=3?j:-1).filter(x=>x>=0),ready=a[13],belief=a[8];
const outcome=[
  'get your peace back',
  'trust yourself and your decisions again',
  'feel free from constantly thinking, checking, waiting or replaying',
  'feel like yourself again and be able to move forward, whether he\'s in your life or not',
  'change what this situation is doing to you'
][a[11]]||'feel more like yourself again';
const stageCopy=[
 {name:'Quiet the Alarm',short:'Your body is getting pulled into it too.',story:'Something happens with him, or sometimes nothing happens at all. A thought, a memory, a change in his tone, wondering what he is doing. Your stomach drops. Your chest tightens. Your mind starts going. You can know better and still feel the reaction.'},
 {name:'Break the Pull',short:'Knowing you should leave it alone is not always enough to make the pull disappear.',story:'You can know checking again probably will not give you the answer you need and still find yourself doing it. One more look. One more replay. One more attempt to work out what he meant or what he might do next.'},
 {name:'Restore Self-Trust',short:'Somewhere in the cycle, you have started questioning yourself.',story:'You know something does not feel right. Then you explain it away. You wonder if you are overreacting, expecting too much or getting it wrong. You make a decision, then something happens and suddenly you are questioning the decision you already made for yourself.'},
 {name:'Return to Yourself',short:'Your own life is getting less of you.',story:'Thinking about him. Wondering. Replaying. Waiting to see what happens next. Whether you are still with him or it ended months ago, he can still be taking up space in your mind and your life. And while all of that is happening, your own life gets less of you.'}
];
const links={
 'Quiet the Alarm':'https://stan.store/YourMindStory/p/quiet-the-alarm',
 'Break the Pull':'https://stan.store/YourMindStory/p/break-the-pull',
 'Restore Self-Trust':'https://stan.store/YourMindStory/p/restore-self-trust',
 'Return to Yourself':'https://stan.store/YourMindStory/p/return-to-yourself-7jc9h8lg'
};
const pairLinks={
 '0|1':'https://stan.store/Yourmindstory/p/quiet-the-alarm--break-the-pull',
 '0|2':'https://stan.store/Yourmindstory/p/quiet-the-alarm--restore-selftrust',
 '0|3':'https://stan.store/Yourmindstory/p/quiet-the-alarm--return-to-yourself',
 '1|2':'https://stan.store/Yourmindstory/p/break-the-pull--restore-selftrust',
 '1|3':'https://stan.store/Yourmindstory/p/break-the-pull--return-to-yourself',
 '2|3':'https://stan.store/Yourmindstory/p/restore-selftrust--return-to-yourself'
};
let recognition='',recommendation='',cta='',route='';
if(qual.length===0){
 recognition='<h1>I wouldn\'t start you with one of the hypnotherapy audios.</h1><p class="lead">That doesn\'t mean nothing is going on. It means your answers don\'t point strongly enough to one part of the cycle for me to sell you a bigger solution than you need.</p>';
 recommendation='<small>WHERE I\'D START</small><h2>The Bare Minimum</h2><p>Start one step earlier. Get clear on the five things a woman needs to stay healthy in love, so you have something solid to come back to when feelings, hope or uncertainty make you question yourself.</p>';
 cta='<p><a class="next" href="https://stan.store/YourMindStory/p/the-bare-minimum">START WITH THE BARE MINIMUM</a></p>';
}else if(qual.length===1){
 let x=stageCopy[qual[0]];
 recognition='<h1>'+x.short+'</h1><p class="lead">'+x.story+'</p><p><strong>That\'s what your answers are showing me.</strong></p>';
 recommendation='<small>WHERE I\'D START</small><h2>'+x.name+'</h2><p>I wouldn\'t give you more than your answers suggest you need. I\'d start here and work on the part of the cycle that is hitting you hardest right now.</p>';
 cta='<p><a class="next" href="'+links[x.name]+'">START WITH '+x.name.toUpperCase()+'</a></p>';
}else if(qual.length===2){
 let x=stageCopy[qual[0]],y=stageCopy[qual[1]],key=qual.join('|');
 recognition='<h1>This is happening in two connected parts of the cycle.</h1><p class="lead">'+x.story+'</p><p>'+y.story+'</p><p><strong>That\'s the important bit. These aren\'t two random problems. One can keep feeding the other.</strong></p>';
 recommendation='<small>WHERE I\'D START</small><h2>'+x.name+' → '+y.name+'</h2><p>First, work on <strong>'+x.name+'</strong>. Then work on <strong>'+y.name+'</strong>. One stage at a time, in the order your answers suggest.</p>';
 cta='<p><a class="next" href="'+pairLinks[key]+'">START YOUR TWO-STAGE PATHWAY</a></p>';
}else{
 recognition='<h1>This isn\'t just one part of the cycle anymore.</h1><p class="lead">Your answers show several parts of it happening at the same time.</p>'+
 '<p>Your body can react. Your mind goes into the loop. You get pulled back towards him even when you know better. You question yourself and decisions you already made. And while all of that is happening, <strong>your own life gets less and less of you.</strong></p>'+
 '<p><strong>You don\'t have four separate problems. These are different parts of the same cycle.</strong></p>';
 recommendation='<small>WHERE I\'D START</small><h2>Return to Yourself</h2><p>I would work through the full four-stage process: <strong>Quiet the Alarm → Break the Pull → Restore Self-Trust → Return to Yourself.</strong></p><p>One stage at a time. The point is not to give you more to do. It is to work on the different places this same cycle is showing up, until more of your mind and your life belong to you again.</p>';
 if(ready===3){
   route='<p>You also told me you\'re ready for a structured process and willing to participate consistently. You can work through the full process independently, or join the <strong>Return to Yourself Bootcamp</strong> for the same four stages with more structure and support.</p>';
   cta='<p><a class="next" href="https://stan.store/Yourmindstory/p/complete-selfguided-journey">SELF-GUIDED JOURNEY</a></p><p><a class="next" href="https://payhip.com/b/ZhPkp">RETURN TO YOURSELF BOOTCAMP</a></p>';
 }else{
   cta='<p><a class="next" href="https://stan.store/Yourmindstory/p/complete-selfguided-journey">START THE SELF-GUIDED JOURNEY</a></p>';
 }
}
let bridge='';
if(qual.length>0){
 bridge='<div class="bridge"><h2>'+ (belief>=2?'You already understand a lot.':'You may still be trying to make sense of him.') +'</h2>'+
 '<p>'+(belief>=2?'But knowing what the pattern is has not stopped what happens when you are actually in it.':'And understanding can help. But there comes a point where another answer about him still leaves you dealing with the same reaction in you.')+'</p>'+
 '<p><strong>Knowing why he did it won\'t stop what it did to you.</strong></p>'+
 '<p>And you do not have to stop loving him, stop wanting him or make a decision about the relationship before you start working on yourself.</p>'+
 '<p>You told me what you want most is to <strong>'+outcome+'</strong>. So that is where I want the recommendation to take us.</p></div>';
}
let el=document.getElementById('result');el.classList.add('active');
el.innerHTML='<div class="eyebrow">Your personalised assessment</div>'+recognition+bridge+'<div class="rec">'+recommendation+route+cta+'</div>';
track('assessment_complete',{total_score:total,breadth_count:qual.length,recommendation:qual.length>=3?'Return to Yourself':qual.length===2?'Two-stage pathway':qual.length===1?stageCopy[qual[0]].name:'The Bare Minimum'});
}
function recommendationCopy(q,r){if(q.length===0)return 'Your scored answers do not show a strong enough concentration in one of the four stages for me to push you into a larger programme. Start with the smallest sensible next step.';if(q.length===1)return 'One stage is clearly asking for attention first. I would begin there rather than giving you more than your answers suggest you need.';if(q.length===2)return 'Two stages are showing up strongly. I would work through those in sequence so the support matches the pattern your answers actually show.';if(r===3)return 'Your answers show a broad pattern across at least three stages, and you have said you are ready to participate consistently. That makes the full four-stage process the most relevant route to consider.';return 'Your answers show a broad pattern across at least three stages. The full four-stage self-guided process lets you work through it in sequence without requiring a live group commitment.'}
track('assessment_start');render();
</script></body></html>
