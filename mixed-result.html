<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Result | Your Mind Story</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/yms-quiz-shared.css">
<script src="assets/yms-quiz-shared.js?v=20260918-journey1"></script>
<script src="assets/yms-results-copy-v2.js?v=20260910-final1"></script>
<script src="assets/yms-product-routing-v2.js?v=20260919-approvedcopy1"></script>
<script src="assets/yms-feedback-invite.js?v=20260922-popup2"></script>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Your Mind Story</div>
  <div class="result-card">
    <p class="result-greeting" id="greeting" hidden data-clarity-mask="True"></p>
    <div id="ogBridge"></div>
  </div>
</div>
<script>
(function(){
  var data = null;
  try { data = YMSQuiz.getResultData(); } catch (e) { data = null; }
  var name = data && data.firstName ? String(data.firstName).trim() : '';
  var greetingEl = document.getElementById('greeting');
  if (name){ greetingEl.textContent = 'Hi, ' + name + '.'; greetingEl.hidden = false; }
  var stages = (data && data.qualifyingStages) || [];
  YMSQuiz.track('quiz_result_view', { result_bucket: 'Mixed', qualifying_stage_count: stages.length });
  YMSQuiz.mountRecommendationV1('ogBridge');
})();
</script>
</body>
</html>
